<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 660 460" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- OUTER RING: Policy Model (red)                           -->
  <!-- Center: 330, 220. Radius: 195                            -->
  <!-- ════════════════════════════════════════════════════════ -->
  <circle cx="330" cy="220" r="195" fill="#c0392b" fill-opacity="0.08" stroke="#c0392b" stroke-width="2"/>

  <!-- Outer ring labels (positioned in the ring area, top) -->
  <text x="330" y="48" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b">Policy Model</text>
  <text x="330" y="65" text-anchor="middle" font-size="10" fill="#922b21">What rules it must obey</text>

  <!-- Civil engineering analog (bottom of outer ring) -->
  <text x="330" y="430" text-anchor="middle" font-size="9" fill="#c0392b" font-style="italic">≈ Building codes + regulations</text>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- MIDDLE RING: Operational Model (orange)                  -->
  <!-- Radius: 135                                              -->
  <!-- ════════════════════════════════════════════════════════ -->
  <circle cx="330" cy="220" r="135" fill="#e67e22" fill-opacity="0.08" stroke="#e67e22" stroke-width="2"/>

  <!-- Middle ring labels (positioned in the ring area, top) -->
  <text x="330" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#e67e22">Operational Model</text>
  <text x="330" y="132" text-anchor="middle" font-size="10" fill="#d35400">How it must perform</text>

  <!-- Civil engineering analog (bottom of middle ring) -->
  <text x="330" y="378" text-anchor="middle" font-size="9" fill="#e67e22" font-style="italic">≈ Structural calculations + material datasheets</text>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- INNER CIRCLE: Event Model (blue)                         -->
  <!-- Radius: 75                                               -->
  <!-- ════════════════════════════════════════════════════════ -->
  <circle cx="330" cy="220" r="75" fill="#3498db" fill-opacity="0.12" stroke="#3498db" stroke-width="2"/>

  <!-- Inner circle labels -->
  <text x="330" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#3498db">Event Model</text>
  <text x="330" y="218" text-anchor="middle" font-size="10" fill="#2471a3">What the system does</text>

  <!-- Civil engineering analog -->
  <text x="330" y="240" text-anchor="middle" font-size="9" fill="#3498db" font-style="italic">≈ Architectural blueprints</text>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- CENTER LABEL                                             -->
  <!-- ════════════════════════════════════════════════════════ -->
  <text x="330" y="268" text-anchor="middle" font-size="9" font-weight="600" fill="#2c3e50">Unified Specification</text>

  <!-- Annotation -->
  <text x="330" y="450" text-anchor="middle" font-size="9" fill="#95a5a6" font-style="italic">complementary and interlocking, not hierarchical</text>

</svg>
