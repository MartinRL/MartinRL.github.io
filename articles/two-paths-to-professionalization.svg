<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#c0392b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2471a3"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="52" text-anchor="middle" font-size="18" font-weight="700" fill="#2c3e50">Two Paths to Professionalization</text>

  <!-- === TOP PATH: Civil Engineering (reactive) === -->
  <text x="36" y="108" font-size="12" font-weight="600" fill="#922b21" letter-spacing="0.5">CIVIL ENGINEERING</text>
  <text x="258" y="108" font-size="11" fill="#922b21" font-style="italic">reactive</text>

  <!-- Nodes -->
  <g filter="url(#shadow)">
    <rect x="36" y="124" width="130" height="48" rx="6" fill="#f9ebea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="101" y="153" text-anchor="middle" font-size="13" fill="#922b21">Failure</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="206" y="124" width="130" height="48" rx="6" fill="#f9ebea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="271" y="153" text-anchor="middle" font-size="13" fill="#922b21">Catastrophe</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="376" y="124" width="130" height="48" rx="6" fill="#f9ebea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="441" y="153" text-anchor="middle" font-size="13" fill="#922b21">Public Pressure</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="546" y="124" width="130" height="48" rx="6" fill="#f9ebea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="611" y="153" text-anchor="middle" font-size="13" fill="#922b21">Regulation</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="716" y="124" width="172" height="48" rx="6" fill="#c0392b" stroke="#922b21" stroke-width="1.5"/>
    <text x="802" y="153" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Professionalization</text>
  </g>

  <!-- Arrows (top) -->
  <line x1="166" y1="148" x2="202" y2="148" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="336" y1="148" x2="372" y2="148" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="506" y1="148" x2="542" y2="148" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="676" y1="148" x2="712" y2="148" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Timeline (top) -->
  <text x="900" y="144" font-size="11" fill="#922b21" font-style="italic">timeline:</text>
  <text x="900" y="162" font-size="14" font-weight="700" fill="#922b21">decades</text>

  <!-- Divider -->
  <line x1="36" y1="220" x2="888" y2="220" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- === BOTTOM PATH: Software Engineering (proactive) === -->
  <text x="36" y="268" font-size="12" font-weight="600" fill="#1a5276" letter-spacing="0.5">SOFTWARE ENGINEERING</text>
  <text x="290" y="268" font-size="11" fill="#1a5276" font-style="italic">proactive</text>

  <!-- Nodes -->
  <g filter="url(#shadow)">
    <rect x="36" y="284" width="130" height="48" rx="6" fill="#eaf2f8" stroke="#2471a3" stroke-width="1.5"/>
    <text x="101" y="313" text-anchor="middle" font-size="13" fill="#1a5276">AI Capability</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="206" y="284" width="130" height="48" rx="6" fill="#eaf2f8" stroke="#2471a3" stroke-width="1.5"/>
    <text x="271" y="313" text-anchor="middle" font-size="13" fill="#1a5276">Productivity Gap</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="376" y="284" width="142" height="48" rx="6" fill="#eaf2f8" stroke="#2471a3" stroke-width="1.5"/>
    <text x="447" y="313" text-anchor="middle" font-size="13" fill="#1a5276">Economic Pressure</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="558" y="284" width="130" height="48" rx="6" fill="#eaf2f8" stroke="#2471a3" stroke-width="1.5"/>
    <text x="623" y="313" text-anchor="middle" font-size="13" fill="#1a5276">Formalization</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="728" y="284" width="160" height="48" rx="6" fill="#2471a3" stroke="#1a5276" stroke-width="1.5"/>
    <text x="808" y="313" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Professionalization</text>
  </g>

  <!-- Arrows (bottom) -->
  <line x1="166" y1="308" x2="202" y2="308" stroke="#2471a3" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="336" y1="308" x2="372" y2="308" stroke="#2471a3" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="518" y1="308" x2="554" y2="308" stroke="#2471a3" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="688" y1="308" x2="724" y2="308" stroke="#2471a3" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Timeline (bottom) -->
  <text x="900" y="304" font-size="11" fill="#1a5276" font-style="italic">timeline:</text>
  <text x="900" y="322" font-size="14" font-weight="700" fill="#1a5276">years</text>

  <!-- Convergence annotation -->
  <line x1="805" y1="176" x2="805" y2="280" stroke="#7f8c8d" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="450" y="420" text-anchor="middle" font-size="12" fill="#566573">Same destination, different forcing functions: catastrophe vs. opportunity.</text>

</svg>
