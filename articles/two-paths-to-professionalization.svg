<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#c0392b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2471a3"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#2c3e50">Two Paths to Professionalization</text>

  <!-- === TOP PATH: Civil Engineering (reactive) === -->
  <text x="36" y="72" font-size="11" font-weight="600" fill="#922b21" letter-spacing="0.5">CIVIL ENGINEERING</text>
  <text x="258" y="72" font-size="10" fill="#922b21" font-style="italic">reactive</text>

  <!-- Nodes -->
  <g filter="url(#shadow)">
    <rect x="36" y="84" width="120" height="40" rx="6" fill="#f9ebea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="96" y="109" text-anchor="middle" font-size="12" fill="#922b21">Failure</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="200" y="84" width="120" height="40" rx="6" fill="#f9ebea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="260" y="109" text-anchor="middle" font-size="12" fill="#922b21">Catastrophe</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="364" y="84" width="120" height="40" rx="6" fill="#f9ebea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="424" y="109" text-anchor="middle" font-size="12" fill="#922b21">Public Pressure</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="528" y="84" width="120" height="40" rx="6" fill="#f9ebea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="588" y="109" text-anchor="middle" font-size="12" fill="#922b21">Regulation</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="692" y="84" width="172" height="40" rx="6" fill="#c0392b" stroke="#922b21" stroke-width="1.5"/>
    <text x="778" y="109" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Professionalization</text>
  </g>

  <!-- Arrows (top) -->
  <line x1="156" y1="104" x2="196" y2="104" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="320" y1="104" x2="360" y2="104" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="484" y1="104" x2="524" y2="104" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="648" y1="104" x2="688" y2="104" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Timeline (top) -->
  <text x="880" y="100" font-size="10" fill="#922b21" font-style="italic">timeline:</text>
  <text x="880" y="116" font-size="13" font-weight="700" fill="#922b21">decades</text>

  <!-- Divider -->
  <line x1="36" y1="155" x2="864" y2="155" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- === BOTTOM PATH: Software Engineering (proactive) === -->
  <text x="36" y="192" font-size="11" font-weight="600" fill="#1a5276" letter-spacing="0.5">SOFTWARE ENGINEERING</text>
  <text x="290" y="192" font-size="10" fill="#1a5276" font-style="italic">proactive</text>

  <!-- Nodes -->
  <g filter="url(#shadow)">
    <rect x="36" y="204" width="120" height="40" rx="6" fill="#eaf2f8" stroke="#2471a3" stroke-width="1.5"/>
    <text x="96" y="229" text-anchor="middle" font-size="12" fill="#1a5276">AI Capability</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="200" y="204" width="120" height="40" rx="6" fill="#eaf2f8" stroke="#2471a3" stroke-width="1.5"/>
    <text x="260" y="229" text-anchor="middle" font-size="12" fill="#1a5276">Productivity Gap</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="364" y="204" width="132" height="40" rx="6" fill="#eaf2f8" stroke="#2471a3" stroke-width="1.5"/>
    <text x="430" y="229" text-anchor="middle" font-size="12" fill="#1a5276">Economic Pressure</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="540" y="204" width="120" height="40" rx="6" fill="#eaf2f8" stroke="#2471a3" stroke-width="1.5"/>
    <text x="600" y="229" text-anchor="middle" font-size="12" fill="#1a5276">Formalization</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="704" y="204" width="160" height="40" rx="6" fill="#2471a3" stroke="#1a5276" stroke-width="1.5"/>
    <text x="784" y="229" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Professionalization</text>
  </g>

  <!-- Arrows (bottom) -->
  <line x1="156" y1="224" x2="196" y2="224" stroke="#2471a3" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="320" y1="224" x2="360" y2="224" stroke="#2471a3" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="496" y1="224" x2="536" y2="224" stroke="#2471a3" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="660" y1="224" x2="700" y2="224" stroke="#2471a3" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Timeline (bottom) -->
  <text x="880" y="220" font-size="10" fill="#1a5276" font-style="italic">timeline:</text>
  <text x="880" y="236" font-size="13" font-weight="700" fill="#1a5276">years</text>

  <!-- Convergence annotation -->
  <path d="M778,128 L778,140 L784,140 L784,200" stroke="#7f8c8d" stroke-width="1.2" stroke-dasharray="3,3" fill="none"/>
  <text x="450" y="300" text-anchor="middle" font-size="11" fill="#566573">Same destination, different forcing functions: catastrophe vs. opportunity.</text>

</svg>
