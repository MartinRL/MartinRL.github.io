<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">

  <!-- Column headers -->
  <text x="130" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#2c3e50">Current Roles</text>
  <text x="810" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#2c3e50">New Archetypes</text>

  <!-- ===== LEFT BANDS (x=40..220, h=50, gap=10) ===== -->
  <!-- Developer: y=70, h=50 -->
  <rect x="40" y="70" width="180" height="50" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="130" y="100" text-anchor="middle" font-size="13" font-weight="500" fill="#2c3e50">Developer</text>

  <!-- Business Analyst: y=130, h=50 -->
  <rect x="40" y="130" width="180" height="50" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="130" y="160" text-anchor="middle" font-size="13" font-weight="500" fill="#2c3e50">Business Analyst</text>

  <!-- Software Architect: y=190, h=50 -->
  <rect x="40" y="190" width="180" height="50" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="130" y="220" text-anchor="middle" font-size="13" font-weight="500" fill="#2c3e50">Software Architect</text>

  <!-- UX Designer: y=250, h=50 -->
  <rect x="40" y="250" width="180" height="50" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="130" y="280" text-anchor="middle" font-size="13" font-weight="500" fill="#2c3e50">UX Designer</text>

  <!-- Quality Assurer: y=310, h=50 -->
  <rect x="40" y="310" width="180" height="50" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="130" y="340" text-anchor="middle" font-size="13" font-weight="500" fill="#2c3e50">Quality Assurer</text>

  <!-- SRE/Platform Engineer: y=370, h=50 -->
  <rect x="40" y="370" width="180" height="50" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="130" y="400" text-anchor="middle" font-size="12" font-weight="500" fill="#2c3e50">SRE / Platform Engineer</text>

  <!-- Security Engineer: y=430, h=50 -->
  <rect x="40" y="430" width="180" height="50" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="130" y="460" text-anchor="middle" font-size="13" font-weight="500" fill="#2c3e50">Security Engineer</text>

  <!-- ===== RIGHT BANDS (x=720..900, all h=50, gap=20) ===== -->
  <!-- 5 boxes × 50px + 4 gaps × 20px = 330px, centered at y=275 → start y=110 -->

  <!-- Domain Engineer: y=110, h=50 -->
  <rect x="720" y="110" width="180" height="50" rx="5" fill="#27ae60" opacity="0.9" stroke="#1e8449" stroke-width="1"/>
  <text x="810" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Domain Engineer</text>

  <!-- Experience Engineer: y=180, h=50 -->
  <rect x="720" y="180" width="180" height="50" rx="5" fill="#16a085" opacity="0.9" stroke="#138d75" stroke-width="1"/>
  <text x="810" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Experience Engineer</text>

  <!-- Harness Engineer: y=250, h=50 -->
  <rect x="720" y="250" width="180" height="50" rx="5" fill="#e67e22" opacity="0.9" stroke="#ca6f1e" stroke-width="1"/>
  <text x="810" y="280" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Harness Engineer</text>

  <!-- Quality Engineer: y=320, h=50 -->
  <rect x="720" y="320" width="180" height="50" rx="5" fill="#8e44ad" opacity="0.9" stroke="#7d3c98" stroke-width="1"/>
  <text x="810" y="350" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Quality Engineer</text>

  <!-- Specification Lead: y=390, h=50 -->
  <rect x="720" y="390" width="180" height="50" rx="5" fill="#2980b9" opacity="0.9" stroke="#2471a3" stroke-width="1"/>
  <text x="810" y="420" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Specification Lead</text>

  <!-- ===== FLOWS (bezier curves, colored by destination) ===== -->
  <!--
    Left bands exit at x=220, right bands start at x=720.
    Control points at cx=440 for smooth S-curves.

    Right-side allocation per box (incoming flows share the 50px height):

    Domain Engineer (110-160):
      BA (33px)   → 110-143
      Arch (17px) → 143-160

    Experience Engineer (180-230):
      Dev (12px)  → 180-192   [engineering root]
      UX (38px)   → 192-230   [design root]

    Harness Engineer (250-300):
      Dev (13px)  → 250-263
      SRE (19px)  → 263-282
      Sec (18px)  → 282-300

    Quality Engineer (320-370):
      QA (25px)   → 320-345
      SRE (13px)  → 345-358
      Sec (12px)  → 358-370

    Specification Lead (390-440):
      Dev (20px)  → 390-410
      Arch (30px) → 410-440
  -->

  <!-- Developer → Harness Engineer (orange) -->
  <path d="M220,70 C440,70 440,250 720,250 L720,263 C440,263 440,87 220,87 Z"
        fill="#e67e22" opacity="0.4"/>

  <!-- Developer → Experience Engineer (teal) [engineering root] -->
  <path d="M220,87 C440,87 440,180 720,180 L720,192 C440,192 440,103 220,103 Z"
        fill="#16a085" opacity="0.4"/>

  <!-- Developer → Specification Lead (blue) -->
  <path d="M220,103 C440,103 440,390 720,390 L720,410 C440,410 440,120 220,120 Z"
        fill="#2980b9" opacity="0.4"/>

  <!-- Business Analyst → Domain Engineer (green) -->
  <path d="M220,130 C440,130 440,110 720,110 L720,143 C440,143 440,180 220,180 Z"
        fill="#27ae60" opacity="0.4"/>

  <!-- Software Architect → Domain Engineer (green) -->
  <path d="M220,190 C440,190 440,143 720,143 L720,160 C440,160 440,215 220,215 Z"
        fill="#27ae60" opacity="0.4"/>

  <!-- Software Architect → Specification Lead (blue) -->
  <path d="M220,215 C440,215 440,410 720,410 L720,440 C440,440 440,240 220,240 Z"
        fill="#2980b9" opacity="0.4"/>

  <!-- UX Designer → Experience Engineer (teal) [design root] -->
  <path d="M220,250 C440,250 440,192 720,192 L720,230 C440,230 440,300 220,300 Z"
        fill="#16a085" opacity="0.4"/>

  <!-- Quality Assurer → Quality Engineer (purple) -->
  <path d="M220,310 C440,310 440,320 720,320 L720,345 C440,345 440,360 220,360 Z"
        fill="#8e44ad" opacity="0.4"/>

  <!-- SRE/Platform → Harness Engineer (orange) -->
  <path d="M220,370 C440,370 440,263 720,263 L720,282 C440,282 440,395 220,395 Z"
        fill="#e67e22" opacity="0.4"/>

  <!-- SRE/Platform → Quality Engineer (purple) -->
  <path d="M220,395 C440,395 440,345 720,345 L720,358 C440,358 440,420 220,420 Z"
        fill="#8e44ad" opacity="0.4"/>

  <!-- Security → Harness Engineer (orange) -->
  <path d="M220,430 C440,430 440,282 720,282 L720,300 C440,300 440,455 220,455 Z"
        fill="#e67e22" opacity="0.4"/>

  <!-- Security → Quality Engineer (purple) -->
  <path d="M220,455 C440,455 440,358 720,358 L720,370 C440,370 440,480 220,480 Z"
        fill="#8e44ad" opacity="0.4"/>

</svg>
