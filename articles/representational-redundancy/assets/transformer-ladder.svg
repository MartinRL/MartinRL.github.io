<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 892 500" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L8,3 L0,6" fill="#95a5a6"/>
    </marker>
  </defs>

  <!-- ascent annotation -->
  <line x1="70" y1="340" x2="260" y2="70" stroke="#95a5a6" stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#arr)"/>
  <text x="140" y="196" font-size="11" fill="#95a5a6" font-style="italic" transform="rotate(-55 140 196)">review-once stratum grows</text>

  <!-- rung 1 -->
  <rect x="20" y="376" width="400" height="100" rx="10" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.6"/>
  <text x="38" y="406" font-size="13.5" font-weight="700" fill="#2c3e50">1 · vibe coding</text>
  <text x="38" y="432" font-size="12.5" fill="#2c3e50">English → LLM → code</text>
  <text x="38" y="456" font-size="11" font-style="italic" fill="#566573">verified by: a human, reviewing everything</text>

  <!-- rung 2 -->
  <rect x="168" y="254" width="400" height="100" rx="10" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.6"/>
  <text x="186" y="284" font-size="13.5" font-weight="700" fill="#2c3e50">2 · spec kits</text>
  <text x="186" y="310" font-size="12.5" fill="#2c3e50">markdown spec → LLM → code + tests</text>
  <text x="186" y="334" font-size="11" font-style="italic" fill="#566573">verified by: a human, on every regeneration</text>

  <!-- rung 2½: the AI plaster, hanging off the side of the ladder, slightly askew -->
  <line x1="568" y1="302" x2="596" y2="302" stroke="#e67e22" stroke-width="1.4" stroke-dasharray="4,4"/>
  <g transform="rotate(4 737 302)">
    <rect x="596" y="252" width="282" height="100" rx="10" fill="#fef9f4" stroke="#e67e22" stroke-width="1.6" stroke-dasharray="7,5"/>
    <text x="614" y="282" font-size="13.5" font-weight="700" fill="#ca6f1e">2½ · the AI plaster</text>
    <text x="614" y="308" font-size="12.5" fill="#2c3e50">rung 2 + an LLM reviewing the LLM</text>
    <text x="614" y="332" font-size="11" font-style="italic" fill="#566573">verified by: an opinion, not an oracle</text>
  </g>

  <!-- rung 3 (the article's position) -->
  <rect x="316" y="132" width="400" height="100" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2.4"/>
  <text x="334" y="162" font-size="13.5" font-weight="700" fill="#1e8449">3 · deterministic derivation</text>
  <text x="334" y="188" font-size="12.5" fill="#2c3e50">formal spec → generator + agent against oracles</text>
  <text x="334" y="212" font-size="11" font-style="italic" fill="#566573">verified by: compiler and tests; generator reviewed once</text>

  <!-- rung 4 -->
  <rect x="464" y="10" width="400" height="100" rx="10" fill="#fdfefe" stroke="#bdc3c7" stroke-width="1.6" stroke-dasharray="7,5"/>
  <text x="482" y="40" font-size="13.5" font-weight="700" fill="#95a5a6">4 · full formal synthesis</text>
  <text x="482" y="66" font-size="12.5" fill="#95a5a6">formal spec → proven synthesis → system</text>
  <text x="482" y="90" font-size="11" font-style="italic" fill="#95a5a6">nobody serious is claiming it</text>
</svg>
