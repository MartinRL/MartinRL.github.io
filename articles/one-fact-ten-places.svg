<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 510" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L8,3 L0,6" fill="#7f8c8d"/>
    </marker>
  </defs>

  <!-- connectors: hub → left column -->
  <line x1="285" y1="250" x2="234" y2="62"  stroke="#95a5a6" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="285" y1="250" x2="234" y2="154" stroke="#95a5a6" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="285" y1="250" x2="234" y2="246" stroke="#95a5a6" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="285" y1="250" x2="234" y2="338" stroke="#95a5a6" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="285" y1="250" x2="234" y2="430" stroke="#95a5a6" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- connectors: hub → right column -->
  <line x1="535" y1="250" x2="586" y2="62"  stroke="#95a5a6" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="535" y1="250" x2="586" y2="154" stroke="#95a5a6" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="535" y1="250" x2="586" y2="246" stroke="#95a5a6" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="535" y1="250" x2="586" y2="338" stroke="#95a5a6" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="535" y1="250" x2="586" y2="430" stroke="#95a5a6" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- hub: the one domain fact -->
  <rect x="285" y="215" width="250" height="70" rx="10" fill="#2c3e50"/>
  <text x="410" y="242" text-anchor="middle" font-size="11" font-style="italic" fill="#bdc3c7">one domain fact</text>
  <text x="410" y="264" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Customer has an email address</text>

  <!-- left column -->
  <rect x="42" y="40"  width="192" height="44" rx="6" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.4"/>
  <text x="138" y="67"  text-anchor="middle" font-size="12.5" fill="#2c3e50">Entity</text>

  <rect x="42" y="132" width="192" height="44" rx="6" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.4"/>
  <text x="138" y="159" text-anchor="middle" font-size="12.5" fill="#2c3e50">DTO</text>

  <rect x="42" y="224" width="192" height="44" rx="6" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.4"/>
  <text x="138" y="251" text-anchor="middle" font-size="12.5" fill="#2c3e50">AutoMapper profile</text>

  <rect x="42" y="316" width="192" height="44" rx="6" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.4"/>
  <text x="138" y="343" text-anchor="middle" font-size="12.5" fill="#2c3e50">EF Core configuration</text>

  <rect x="42" y="408" width="192" height="44" rx="6" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.4"/>
  <text x="138" y="435" text-anchor="middle" font-size="12.5" fill="#2c3e50">SQL column</text>

  <!-- right column -->
  <rect x="586" y="40"  width="192" height="44" rx="6" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.4"/>
  <text x="682" y="67"  text-anchor="middle" font-size="12.5" fill="#2c3e50">Migration</text>

  <rect x="586" y="132" width="192" height="44" rx="6" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.4"/>
  <text x="682" y="159" text-anchor="middle" font-size="12.5" fill="#2c3e50">FluentValidation rule</text>

  <rect x="586" y="224" width="192" height="44" rx="6" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.4"/>
  <text x="682" y="251" text-anchor="middle" font-size="12.5" fill="#2c3e50">OpenAPI schema</text>

  <rect x="586" y="316" width="192" height="44" rx="6" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.4"/>
  <text x="682" y="343" text-anchor="middle" font-size="12.5" fill="#2c3e50">TypeScript interface</text>

  <rect x="586" y="408" width="192" height="44" rx="6" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.4"/>
  <text x="682" y="435" text-anchor="middle" font-size="12.5" fill="#2c3e50">Test fixture</text>

  <!-- bottom annotation -->
  <text x="410" y="496" text-anchor="middle" font-size="11" font-style="italic" fill="#c0392b">every change is a coherent edit across all ten sites, and no compiler holds them together</text>
</svg>
