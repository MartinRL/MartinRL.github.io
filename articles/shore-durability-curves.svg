<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 1100 570" font-family="sans-serif">
  <title>Shore's durability backstop — three trajectories of a 2× agentic output boost</title>
  <desc>A single-panel line chart showing four trajectories of effective engineering output rate over 24 months following adoption of a 2× agentic output boost. The y-axis is effective output rate, normalized so the pre-agentic baseline at t=0 equals 1.0; the agentic boost starts at 2.0. The x-axis is months from agentic adoption. A gray dashed Baseline curve declines slowly from 1.0 at t=0 to 0.6 at t=24, representing Shore's "below 50% within 2.5 years" maintenance-tax decay without agentic adoption. A red Doubled-maintenance curve falls from 2.0 to zero, crossing baseline at month 5 and reaching 100% maintenance with no new output by month 9; this is the realistic no-harness trajectory. An orange Flat-maintenance curve falls from 2.0 to 0.34, crossing baseline at month 19; this is the optimistic no-harness trajectory. A green Halved-maintenance curve stays nearly flat at 2.0 and never crosses baseline; this is the durable trajectory and is only achievable with harness investment in PUT contracts, CH ≥ 9.4, FCIS, and Event Modeling. Two dotted droplines at month 5 and month 19 mark the crossings. The chart's takeaway is that a 2× output boost without harness investment evaporates within 5 to 19 months, while harness investment is what makes the green line possible and the gain durable. Curves are illustrative linear approximations, not predictions.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!--
    Plot geometry
    Plot area: x in [100, 820] (720 px = 24 months at 30 px/mo)
                y in [80, 560]  (480 px = 2.2 units at ~218.18 px/unit)
    Right margin (820–1100) reserved for inline curve labels.
    x(t) = 100 + 30*t
    y(v) = 80  + 218.18*(2.2 - v)

    Key points
      Baseline: (0, 1.0) → (24, 0.6)            : (100, 341.8) → (820, 429.1)
      Red doubled:  (0, 2.0) → y=0 at t=9.231   : (100, 123.6) → (376.9, 560)
      Orange flat:  (0, 2.0) → (24, 0.336)      : (100, 123.6) → (820, 485.9)
      Green halved: (0, 2.0) → (24, 1.8)        : (100, 123.6) → (820, 167.3)

    Crossings with baseline
      Red vs baseline at t=5  : (250, 316.4)
      Orange vs baseline at t=19: (670, 411.0)
  -->

  <!-- ================== TITLE ================== -->

  <!-- ================== GRIDLINES ================== -->
  <line x1="100" y1="450.9" x2="820" y2="450.9" stroke="#e9ecef" stroke-width="1"/>
  <line x1="100" y1="341.8" x2="820" y2="341.8" stroke="#dee2e6" stroke-width="1"/>
  <line x1="100" y1="232.7" x2="820" y2="232.7" stroke="#e9ecef" stroke-width="1"/>
  <line x1="100" y1="123.6" x2="820" y2="123.6" stroke="#e9ecef" stroke-width="1"/>

  <!-- ================== AXES ================== -->
  <!-- Y axis -->
  <line x1="100" y1="560" x2="100" y2="65" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- X axis -->
  <line x1="100" y1="560" x2="835" y2="560" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Y axis label (rotated) -->
  <text x="40" y="320" text-anchor="middle" font-size="13" fill="#555" transform="rotate(-90 40 320)">Effective output rate (baseline at t=0 = 1.0)</text>

  <!-- Y axis tick labels -->
  <text x="92" y="564" text-anchor="end" font-size="11" fill="#555">0</text>
  <text x="92" y="454.9" text-anchor="end" font-size="11" fill="#555">0.5</text>
  <text x="92" y="345.8" text-anchor="end" font-size="11" fill="#555">1.0</text>
  <text x="92" y="236.7" text-anchor="end" font-size="11" fill="#555">1.5</text>
  <text x="92" y="127.6" text-anchor="end" font-size="11" fill="#555">2.0</text>

  <!-- Y axis ticks -->
  <line x1="95" y1="560"   x2="100" y2="560"   stroke="#333" stroke-width="1"/>
  <line x1="95" y1="450.9" x2="100" y2="450.9" stroke="#333" stroke-width="1"/>
  <line x1="95" y1="341.8" x2="100" y2="341.8" stroke="#333" stroke-width="1"/>
  <line x1="95" y1="232.7" x2="100" y2="232.7" stroke="#333" stroke-width="1"/>
  <line x1="95" y1="123.6" x2="100" y2="123.6" stroke="#333" stroke-width="1"/>

  <!-- X axis tick labels (every 4 months) -->
  <text x="100" y="580" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="220" y="580" text-anchor="middle" font-size="11" fill="#555">4</text>
  <text x="340" y="580" text-anchor="middle" font-size="11" fill="#555">8</text>
  <text x="460" y="580" text-anchor="middle" font-size="11" fill="#555">12</text>
  <text x="580" y="580" text-anchor="middle" font-size="11" fill="#555">16</text>
  <text x="700" y="580" text-anchor="middle" font-size="11" fill="#555">20</text>
  <text x="820" y="580" text-anchor="middle" font-size="11" fill="#555">24</text>

  <!-- X axis ticks -->
  <line x1="100" y1="560" x2="100" y2="565" stroke="#333" stroke-width="1"/>
  <line x1="220" y1="560" x2="220" y2="565" stroke="#333" stroke-width="1"/>
  <line x1="340" y1="560" x2="340" y2="565" stroke="#333" stroke-width="1"/>
  <line x1="460" y1="560" x2="460" y2="565" stroke="#333" stroke-width="1"/>
  <line x1="580" y1="560" x2="580" y2="565" stroke="#333" stroke-width="1"/>
  <line x1="700" y1="560" x2="700" y2="565" stroke="#333" stroke-width="1"/>
  <line x1="820" y1="560" x2="820" y2="565" stroke="#333" stroke-width="1"/>

  <!-- X axis label -->
  <text x="460" y="610" text-anchor="middle" font-size="13" fill="#555">Months from agentic adoption →</text>

  <!-- ================== CROSSOVER DROPLINES ================== -->
  <!-- Red crossing at t=5 -->
  <line x1="250" y1="316.4" x2="250" y2="560" stroke="#c92a2a" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>
  <text x="250" y="600" text-anchor="middle" font-size="11" font-weight="bold" fill="#c92a2a">5 mo: gain erased</text>

  <!-- Orange crossing at t=19 -->
  <line x1="670" y1="411.0" x2="670" y2="560" stroke="#e67700" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>
  <text x="670" y="600" text-anchor="middle" font-size="11" font-weight="bold" fill="#e67700">19 mo: gain erased</text>

  <!-- ================== CURVES ================== -->
  <!-- Baseline (no agentic) — gray dashed -->
  <line x1="100" y1="341.8" x2="820" y2="429.1" stroke="#868e96" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- Red doubled maintenance — solid, terminates at y=0 -->
  <line x1="100" y1="123.6" x2="376.9" y2="560" stroke="#c92a2a" stroke-width="3"/>

  <!-- Orange flat maintenance — solid -->
  <line x1="100" y1="123.6" x2="820" y2="485.9" stroke="#e67700" stroke-width="3"/>

  <!-- Green halved maintenance — solid -->
  <line x1="100" y1="123.6" x2="820" y2="167.3" stroke="#2f9e44" stroke-width="3"/>

  <!-- Crossover markers -->
  <circle cx="250" cy="358" r="4" fill="#c92a2a"/>
  <circle cx="670" cy="411.0" r="4" fill="#e67700"/>

  <!-- ================== INLINE CURVE LABELS ================== -->
  <!-- Green: rightmost end, well above other lines -->
  <text x="830" y="171" font-size="12" font-weight="bold" fill="#2f9e44">Halved maint · durable</text>

  <!-- "Durable" callout above green near right end -->
  <text x="780" y="150" text-anchor="middle" font-size="11" font-style="italic" font-weight="bold" fill="#2f9e44">Durable</text>

  <!-- Baseline label at right end -->
  <text x="830" y="432" font-size="12" font-weight="bold" fill="#495057">Baseline (no agentic)</text>

  <!-- Orange label at right end -->
  <text x="830" y="489" font-size="12" font-weight="bold" fill="#e67700">Flat maint · 19 mo</text>

  <!-- Red label near termination point (red dies at t≈9.2, y=0) -->
  <text x="385" y="555" font-size="12" font-weight="bold" fill="#c92a2a">Doubled maint · 5 mo</text>
  <text x="385" y="540" font-size="10" font-style="italic" fill="#c92a2a">100% maintenance, no new output</text>

  <!-- Termination marker on red -->
  <circle cx="376.9" cy="560" r="4" fill="#c92a2a"/>

  <!-- ================== STARTING POINTS ================== -->
  <circle cx="100" cy="123.6" r="3.5" fill="#333"/>
  <circle cx="100" cy="341.8" r="3.5" fill="#868e96"/>

  <!-- "2× boost starts" annotation -->
  <text x="108" y="118" font-size="10" font-style="italic" fill="#555">2× boost at t=0</text>

  <!-- ================== CAPTION ================== -->
</svg>
