<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">

  <!-- Column headers -->
  <text x="130" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#2c3e50">Traditional Functions</text>
  <text x="810" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#2c3e50">Specification-Driven R&amp;D</text>

  <!-- ===== LEFT BOXES (x=40..220) ===== -->
  <!-- Product Management: y=80, h=70 -->
  <rect x="40" y="80" width="180" height="70" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="130" y="112" text-anchor="middle" font-size="13" font-weight="500" fill="#2c3e50">Product</text>
  <text x="130" y="130" text-anchor="middle" font-size="11" fill="#7f8c8d">"what to build"</text>

  <!-- Design: y=175, h=70 -->
  <rect x="40" y="175" width="180" height="70" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="130" y="207" text-anchor="middle" font-size="13" font-weight="500" fill="#2c3e50">Design</text>
  <text x="130" y="225" text-anchor="middle" font-size="11" fill="#7f8c8d">"how it feels"</text>

  <!-- Engineering: y=270, h=70 -->
  <rect x="40" y="270" width="180" height="70" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="130" y="302" text-anchor="middle" font-size="13" font-weight="500" fill="#2c3e50">Engineering</text>
  <text x="130" y="320" text-anchor="middle" font-size="11" fill="#7f8c8d">"how it works"</text>

  <!-- ===== RIGHT: R&D container (x=700..920) ===== -->
  <rect x="700" y="70" width="220" height="280" rx="8" fill="#2c3e50" opacity="0.07" stroke="#2c3e50" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="810" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#2c3e50">R&amp;D</text>

  <!-- Four specification layer boxes inside R&D -->
  <!-- Behavioral: y=115, h=42 -->
  <rect x="720" y="115" width="180" height="42" rx="5" fill="#27ae60" opacity="0.9" stroke="#1e8449" stroke-width="1"/>
  <text x="810" y="133" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Behavioral</text>
  <text x="810" y="148" text-anchor="middle" font-size="10" fill="#d5f5e3">(Event Model)</text>

  <!-- Experience: y=167, h=42 -->
  <rect x="720" y="167" width="180" height="42" rx="5" fill="#16a085" opacity="0.9" stroke="#138d75" stroke-width="1"/>
  <text x="810" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Experience</text>
  <text x="810" y="200" text-anchor="middle" font-size="10" fill="#d1f2eb">(Experience Model)</text>

  <!-- Operational: y=219, h=42 -->
  <rect x="720" y="219" width="180" height="42" rx="5" fill="#e67e22" opacity="0.9" stroke="#ca6f1e" stroke-width="1"/>
  <text x="810" y="237" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Operational</text>
  <text x="810" y="252" text-anchor="middle" font-size="10" fill="#fdebd0">(Substrate + Providers)</text>

  <!-- Policy: y=271, h=42 -->
  <rect x="720" y="271" width="180" height="42" rx="5" fill="#8e44ad" opacity="0.9" stroke="#7d3c98" stroke-width="1"/>
  <text x="810" y="289" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Policy</text>
  <text x="810" y="304" text-anchor="middle" font-size="10" fill="#e8daef">(Invariants + Compliance)</text>

  <!-- Lifecycle label below R&D box -->
  <text x="810" y="370" text-anchor="middle" font-size="11" font-weight="600" fill="#2c3e50">Specify → Plan → Verify → Apply → Observe</text>

  <!-- ===== FLOWS (Sankey-style bezier curves) ===== -->
  <!--
    Product Management → Behavioral (green) + Policy (purple)
    Design → Experience (teal)
    Engineering → Operational (orange) + Policy (purple)
  -->

  <!-- Product → Behavioral (green) - main flow -->
  <path d="M220,90 C440,90 440,120 720,120 L720,148 C440,148 440,118 220,118 Z"
        fill="#27ae60" opacity="0.35"/>

  <!-- Product → Policy (purple) - secondary flow -->
  <path d="M220,118 C440,118 440,276 720,276 L720,290 C440,290 440,140 220,140 Z"
        fill="#8e44ad" opacity="0.25"/>

  <!-- Design → Experience (teal) - full flow -->
  <path d="M220,180 C440,180 440,170 720,170 L720,205 C440,205 440,240 220,240 Z"
        fill="#16a085" opacity="0.35"/>

  <!-- Engineering → Operational (orange) - main flow -->
  <path d="M220,275 C440,275 440,224 720,224 L720,256 C440,256 440,305 220,305 Z"
        fill="#e67e22" opacity="0.35"/>

  <!-- Engineering → Policy (purple) - secondary flow -->
  <path d="M220,305 C440,305 440,290 720,290 L720,308 C440,308 440,335 220,335 Z"
        fill="#8e44ad" opacity="0.25"/>

</svg>
