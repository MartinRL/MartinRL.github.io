<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Causal loop diagram of the throughput trap: a balancing loop from agent output through code in production, upkeep and capacity, and a reinforcing loop between code health and defects per change.</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#16213E"/></marker>
    <marker id="arrP" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#7030A0"/></marker>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>

  <!-- nodes -->
  <text x="190" y="305" font-size="17" font-weight="bold" fill="#16213E" text-anchor="middle">agent output</text>
  <text x="190" y="326" font-size="13" fill="#495057" text-anchor="middle">the tap, m×</text>

  <rect x="410" y="80" width="240" height="72" rx="12" fill="#7030A0" fill-opacity="0.12" stroke="#7030A0" stroke-width="1.5"/>
  <text x="530" y="111" font-size="17" font-weight="bold" fill="#7030A0" text-anchor="middle">code in production</text>
  <text x="530" y="132" font-size="13" fill="#7030A0" text-anchor="middle">the stock</text>

  <text x="840" y="305" font-size="17" font-weight="bold" fill="#16213E" text-anchor="middle">upkeep</text>
  <text x="840" y="326" font-size="13" fill="#495057" text-anchor="middle">the drain, k per unit</text>

  <text x="530" y="520" font-size="17" font-weight="bold" fill="#16213E" text-anchor="middle">capacity for new work</text>

  <text x="1060" y="150" font-size="17" font-weight="bold" fill="#16213E" text-anchor="middle">defects per change</text>
  <text x="1060" y="480" font-size="17" font-weight="bold" fill="#16213E" text-anchor="middle">code health</text>

  <!-- B loop: output -> code -> upkeep -> capacity -> output -->
  <path d="M255,285 Q300,150 400,122" fill="none" stroke="#16213E" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="392" y="108" font-size="18" font-weight="bold" fill="#16213E">+</text>

  <path d="M660,122 Q770,150 815,283" fill="none" stroke="#16213E" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="820" y="268" font-size="18" font-weight="bold" fill="#16213E">+</text>

  <path d="M815,340 Q770,470 660,505" fill="none" stroke="#16213E" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="672" y="530" font-size="18" font-weight="bold" fill="#16213E">−</text>

  <path d="M400,505 Q290,470 245,340" fill="none" stroke="#16213E" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="222" y="358" font-size="18" font-weight="bold" fill="#16213E">+</text>

  <circle cx="530" cy="310" r="30" fill="none" stroke="#16213E" stroke-width="2"/>
  <text x="530" y="318" font-size="22" font-weight="bold" fill="#16213E" text-anchor="middle">B</text>
  <text x="530" y="362" font-size="13" font-style="italic" fill="#495057" text-anchor="middle">the drain: balancing</text>

  <!-- velocity chart annotation -->
  <text x="395" y="200" font-size="12.5" font-style="italic" fill="#868e96" text-anchor="middle">the only arrow a</text>
  <text x="395" y="216" font-size="12.5" font-style="italic" fill="#868e96" text-anchor="middle">velocity chart reads</text>

  <!-- R loop: code health <-> defects, defects -> upkeep -->
  <path d="M1075,455 Q1180,310 1075,175" fill="none" stroke="#7030A0" stroke-width="2.5" marker-end="url(#arrP)"/>
  <text x="1100" y="190" font-size="18" font-weight="bold" fill="#7030A0">−</text>

  <path d="M1045,175 Q950,310 1045,455" fill="none" stroke="#7030A0" stroke-width="2.5" marker-end="url(#arrP)"/>
  <text x="1010" y="452" font-size="18" font-weight="bold" fill="#7030A0">−</text>

  <path d="M985,165 Q930,200 880,285" fill="none" stroke="#7030A0" stroke-width="2.5" marker-end="url(#arrP)"/>
  <text x="858" y="262" font-size="18" font-weight="bold" fill="#7030A0">+</text>

  <circle cx="1060" cy="310" r="30" fill="none" stroke="#7030A0" stroke-width="2"/>
  <text x="1060" y="318" font-size="22" font-weight="bold" fill="#7030A0" text-anchor="middle">R</text>
  <text x="1060" y="508" font-size="13" font-style="italic" fill="#7030A0" text-anchor="middle">the indenture: reinforcing</text>

  <!-- legend -->
  <text x="600" y="590" font-size="12.5" fill="#868e96" text-anchor="middle">+ moves the same way · − moves the opposite way · B balancing loop · R reinforcing loop</text>
</svg>
