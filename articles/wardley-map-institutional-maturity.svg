<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-evolve" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2471a3"/>
    </marker>
    <marker id="arrow-dep" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5" fill="#95a5a6"/>
    </marker>
  </defs>

  <!-- ===== AXES ===== -->
  <!-- Main axis lines -->
  <line x1="120" y1="70" x2="120" y2="490" stroke="#2c3e50" stroke-width="1.5"/>
  <line x1="120" y1="490" x2="880" y2="490" stroke="#2c3e50" stroke-width="1.5"/>

  <!-- Y-axis label -->
  <text x="28" y="280" text-anchor="middle" font-size="12" font-weight="600" fill="#2c3e50" transform="rotate(-90 28 280)">Visibility / Value Chain</text>
  <text x="56" y="88" font-size="9" fill="#7f8c8d" font-style="italic">user need</text>
  <text x="56" y="484" font-size="9" fill="#7f8c8d" font-style="italic">infrastructure</text>
  <!-- Y-axis arrows -->
  <line x1="54" y1="96" x2="54" y2="74" stroke="#7f8c8d" stroke-width="0.8"/>
  <path d="M51,78 L54,70 L57,78" fill="none" stroke="#7f8c8d" stroke-width="0.8"/>
  <line x1="54" y1="470" x2="54" y2="448" stroke="#7f8c8d" stroke-width="0.8"/>
  <path d="M51,452 L54,444 L57,452" fill="none" stroke="#7f8c8d" stroke-width="0.8"/>

  <!-- X-axis stage labels -->
  <text x="215" y="518" text-anchor="middle" font-size="11" font-weight="600" fill="#2c3e50">Genesis</text>
  <text x="405" y="518" text-anchor="middle" font-size="11" font-weight="600" fill="#2c3e50">Custom-built</text>
  <text x="595" y="518" text-anchor="middle" font-size="11" font-weight="600" fill="#2c3e50">Product</text>
  <text x="785" y="518" text-anchor="middle" font-size="11" font-weight="600" fill="#2c3e50">Commodity</text>

  <!-- X-axis evolution arrow -->
  <text x="500" y="536" text-anchor="middle" font-size="10" fill="#7f8c8d" font-style="italic">Evolution →</text>

  <!-- Stage divider lines -->
  <line x1="310" y1="70" x2="310" y2="490" stroke="#d5dbdb" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="500" y1="70" x2="500" y2="490" stroke="#d5dbdb" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="690" y1="70" x2="690" y2="490" stroke="#d5dbdb" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ===== INSTITUTIONAL DEBT ZONE ===== -->
  <rect x="125" y="300" width="200" height="185" rx="8" fill="#e74c3c" opacity="0.07" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="225" y="478" text-anchor="middle" font-size="10" font-weight="600" fill="#c0392b" opacity="0.7">INSTITUTIONAL DEBT</text>

  <!-- ===== EVOLVING COMPONENTS (blue) ===== -->

  <!-- Specification practices: custom-built, evolving toward Product -->
  <circle cx="370" cy="140" r="8" fill="#2471a3"/>
  <text x="388" y="136" font-size="11" font-weight="600" fill="#1a5276">Specification</text>
  <text x="388" y="150" font-size="11" font-weight="600" fill="#1a5276">practices</text>
  <line x1="382" y1="140" x2="530" y2="140" stroke="#2471a3" stroke-width="1.8" marker-end="url(#arrow-evolve)" stroke-dasharray="none"/>

  <!-- Verification systems: custom-built, slight evolution -->
  <circle cx="340" cy="220" r="8" fill="#2471a3"/>
  <text x="358" y="216" font-size="11" font-weight="600" fill="#1a5276">Verification</text>
  <text x="358" y="230" font-size="11" font-weight="600" fill="#1a5276">systems</text>
  <line x1="352" y1="220" x2="440" y2="220" stroke="#2471a3" stroke-width="1.8" marker-end="url(#arrow-evolve)"/>

  <!-- Provider/substrate profiles: genesis→custom boundary, slight evolution -->
  <circle cx="250" cy="290" r="8" fill="#2471a3"/>
  <text x="268" y="286" font-size="11" font-weight="600" fill="#1a5276">Provider / substrate</text>
  <text x="268" y="300" font-size="11" font-weight="600" fill="#1a5276">profiles</text>
  <line x1="262" y1="290" x2="330" y2="290" stroke="#2471a3" stroke-width="1.8" marker-end="url(#arrow-evolve)"/>

  <!-- ===== STUCK COMPONENTS (red) ===== -->

  <!-- Industry standards: genesis -->
  <circle cx="185" cy="340" r="8" fill="#c0392b"/>
  <text x="203" y="344" font-size="11" font-weight="600" fill="#922b21">Industry standards</text>

  <!-- Professional licensure: genesis -->
  <circle cx="195" cy="395" r="8" fill="#c0392b"/>
  <text x="213" y="399" font-size="11" font-weight="600" fill="#922b21">Professional licensure</text>

  <!-- Education & credentialing: genesis -->
  <circle cx="175" cy="450" r="8" fill="#c0392b"/>
  <text x="193" y="454" font-size="11" font-weight="600" fill="#922b21">Education &amp; credentialing</text>

  <!-- ===== DEPENDENCY LINES (dashed gray) ===== -->

  <!-- Licensure depends on Education -->
  <line x1="195" y1="403" x2="180" y2="440" stroke="#95a5a6" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-dep)"/>

  <!-- Standards depend on Specification practices maturing -->
  <path d="M193,340 C260,340 300,200 362,145" fill="none" stroke="#95a5a6" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-dep)"/>

  <!-- ===== LEGEND ===== -->
  <g transform="translate(620, 380)">
    <rect x="0" y="0" width="240" height="95" rx="6" fill="#f8f9fa" stroke="#d5dbdb" stroke-width="1"/>
    <circle cx="20" cy="22" r="6" fill="#2471a3"/>
    <line x1="32" y1="22" x2="60" y2="22" stroke="#2471a3" stroke-width="1.5" marker-end="url(#arrow-evolve)"/>
    <text x="70" y="26" font-size="10" fill="#2c3e50">Evolving (orgs are building these)</text>

    <circle cx="20" cy="48" r="6" fill="#c0392b"/>
    <text x="70" y="52" font-size="10" fill="#2c3e50">Stuck in Genesis</text>

    <line x1="14" y1="74" x2="42" y2="74" stroke="#95a5a6" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-dep)"/>
    <text x="70" y="78" font-size="10" fill="#2c3e50">Dependency</text>
  </g>

</svg>
