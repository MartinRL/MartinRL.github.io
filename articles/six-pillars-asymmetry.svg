<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ===== PEDIMENT (triangular roof, scaffolding style) ===== -->
  <polygon points="480,40 140,140 820,140"
           fill="none" stroke="#bdc3c7" stroke-width="2" stroke-dasharray="8,4"/>
  <!-- Pediment inner line -->
  <line x1="170" y1="136" x2="790" y2="136" stroke="#bdc3c7" stroke-width="1.5" stroke-dasharray="8,4"/>

  <!-- Pediment label -->
  <text x="480" y="108" text-anchor="middle" font-size="12" fill="#95a5a6" font-style="italic">Engineering Discipline</text>

  <!-- ===== SIX PILLARS (scaffolding/wireframe) ===== -->
  <!-- Pillar positions: evenly spaced from x=180 to x=780, width=60, height=220 -->
  <!-- y: 150 to 370 -->

  <!-- Pillar 1: Formal specification -->
  <rect x="160" y="150" width="60" height="220" rx="2"
        fill="#f8f9fa" fill-opacity="0.3" stroke="#bdc3c7" stroke-width="1.8" stroke-dasharray="6,4"/>
  <!-- Cross-bracing (scaffolding detail) -->
  <line x1="160" y1="210" x2="220" y2="210" stroke="#d5dbdb" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="160" y1="270" x2="220" y2="270" stroke="#d5dbdb" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="160" y1="330" x2="220" y2="330" stroke="#d5dbdb" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="190" y="395" text-anchor="middle" font-size="10" fill="#95a5a6">Formal</text>
  <text x="190" y="408" text-anchor="middle" font-size="10" fill="#95a5a6">specification</text>

  <!-- Pillar 2: Material datasheets -->
  <rect x="280" y="150" width="60" height="220" rx="2"
        fill="#f8f9fa" fill-opacity="0.3" stroke="#bdc3c7" stroke-width="1.8" stroke-dasharray="6,4"/>
  <line x1="280" y1="210" x2="340" y2="210" stroke="#d5dbdb" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="280" y1="270" x2="340" y2="270" stroke="#d5dbdb" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="280" y1="330" x2="340" y2="330" stroke="#d5dbdb" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="310" y="395" text-anchor="middle" font-size="10" fill="#95a5a6">Material</text>
  <text x="310" y="408" text-anchor="middle" font-size="10" fill="#95a5a6">datasheets</text>

  <!-- Pillar 3: Building codes -->
  <rect x="400" y="150" width="60" height="220" rx="2"
        fill="#f8f9fa" fill-opacity="0.3" stroke="#bdc3c7" stroke-width="1.8" stroke-dasharray="6,4"/>
  <line x1="400" y1="210" x2="460" y2="210" stroke="#d5dbdb" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="400" y1="270" x2="460" y2="270" stroke="#d5dbdb" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="400" y1="330" x2="460" y2="330" stroke="#d5dbdb" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="430" y="395" text-anchor="middle" font-size="10" fill="#95a5a6">Building</text>
  <text x="430" y="408" text-anchor="middle" font-size="10" fill="#95a5a6">codes</text>

  <!-- Pillar 4: Simulation -->
  <rect x="520" y="150" width="60" height="220" rx="2"
        fill="#f8f9fa" fill-opacity="0.3" stroke="#bdc3c7" stroke-width="1.8" stroke-dasharray="6,4"/>
  <line x1="520" y1="210" x2="580" y2="210" stroke="#d5dbdb" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="520" y1="270" x2="580" y2="270" stroke="#d5dbdb" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="520" y1="330" x2="580" y2="330" stroke="#d5dbdb" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="550" y="402" text-anchor="middle" font-size="10" fill="#95a5a6">Simulation</text>

  <!-- Pillar 5: Professional licensure -->
  <rect x="640" y="150" width="60" height="220" rx="2"
        fill="#f8f9fa" fill-opacity="0.3" stroke="#bdc3c7" stroke-width="1.8" stroke-dasharray="6,4"/>
  <line x1="640" y1="210" x2="700" y2="210" stroke="#d5dbdb" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="640" y1="270" x2="700" y2="270" stroke="#d5dbdb" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="640" y1="330" x2="700" y2="330" stroke="#d5dbdb" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="670" y="395" text-anchor="middle" font-size="10" fill="#95a5a6">Professional</text>
  <text x="670" y="408" text-anchor="middle" font-size="10" fill="#95a5a6">licensure</text>

  <!-- Pillar 6: Formal education -->
  <rect x="760" y="150" width="60" height="220" rx="2"
        fill="#f8f9fa" fill-opacity="0.3" stroke="#bdc3c7" stroke-width="1.8" stroke-dasharray="6,4"/>
  <line x1="760" y1="210" x2="820" y2="210" stroke="#d5dbdb" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="760" y1="270" x2="820" y2="270" stroke="#d5dbdb" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="760" y1="330" x2="820" y2="330" stroke="#d5dbdb" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="790" y="395" text-anchor="middle" font-size="10" fill="#95a5a6">Formal</text>
  <text x="790" y="408" text-anchor="middle" font-size="10" fill="#95a5a6">education</text>

  <!-- ===== FOUNDATION SLAB (bright, what AI addresses) ===== -->
  <rect x="120" y="430" width="720" height="60" rx="6"
        fill="#2471a3" filter="url(#glow)"/>
  <rect x="120" y="430" width="720" height="60" rx="6"
        fill="#2471a3"/>
  <text x="480" y="458" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Code Production / Construction</text>
  <text x="480" y="478" text-anchor="middle" font-size="11" fill="#aed6f1" font-style="italic">what current AI accelerates</text>

  <!-- ===== ANNOTATION ===== -->
  <!-- Arrow pointing to the scaffolding pillars -->
  <text x="890" y="260" text-anchor="end" font-size="10" fill="#95a5a6" font-style="italic">← still scaffolding</text>

</svg>
