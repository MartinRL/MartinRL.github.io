<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Output generates outcome when used by customers; outcome generates impact for the organization. After Christophe Achouiantz.</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#16213E"/></marker>
  </defs>
  <rect width="1200" height="300" fill="#ffffff"/>

  <!-- OUTPUT -->
  <rect x="50" y="50" width="300" height="72" rx="36" fill="#dee2e6"/>
  <text x="200" y="97" font-size="30" font-weight="bold" fill="#16213E" text-anchor="middle" letter-spacing="2">OUTPUT</text>
  <text x="200" y="158" font-size="15" font-style="italic" fill="#343a40" text-anchor="middle">tasks and to-dos</text>
  <text x="90" y="210" font-size="15" fill="#343a40">☑  user story, epic</text>
  <text x="90" y="240" font-size="15" fill="#343a40">☑  feature</text>
  <text x="90" y="270" font-size="15" fill="#343a40">☑  product</text>

  <!-- generates when used by customers -->
  <line x1="365" y1="86" x2="435" y2="86" stroke="#16213E" stroke-width="2" marker-end="url(#arr)"/>
  <text x="400" y="110" font-size="12.5" font-weight="bold" fill="#16213E" text-anchor="middle">generates</text>
  <text x="400" y="126" font-size="10.5" fill="#495057" text-anchor="middle">when used by customers</text>

  <!-- OUTCOME -->
  <rect x="450" y="50" width="300" height="72" rx="36" fill="#d3f0dc"/>
  <text x="600" y="97" font-size="30" font-weight="bold" fill="#16213E" text-anchor="middle" letter-spacing="2">OUTCOME</text>
  <text x="600" y="158" font-size="15" font-style="italic" fill="#343a40" text-anchor="middle">customers</text>
  <text x="490" y="210" font-size="15" fill="#343a40">★  problems solved</text>
  <text x="490" y="240" font-size="15" fill="#343a40">★  new possibilities</text>
  <text x="490" y="270" font-size="15" fill="#343a40">★  customers adopt or change behaviours</text>

  <!-- generates -->
  <line x1="765" y1="86" x2="835" y2="86" stroke="#16213E" stroke-width="2" marker-end="url(#arr)"/>
  <text x="800" y="110" font-size="12.5" font-weight="bold" fill="#16213E" text-anchor="middle">generates</text>

  <!-- IMPACT -->
  <rect x="850" y="50" width="300" height="72" rx="36" fill="#e2dcf5"/>
  <text x="1000" y="97" font-size="30" font-weight="bold" fill="#16213E" text-anchor="middle" letter-spacing="2">IMPACT</text>
  <text x="1000" y="158" font-size="15" font-style="italic" fill="#343a40" text-anchor="middle">the organization</text>
  <text x="890" y="210" font-size="15" fill="#343a40">bottom line, net result for the org</text>
  <text x="890" y="240" font-size="15" fill="#343a40">(money, financial ratios)</text>

</svg>
