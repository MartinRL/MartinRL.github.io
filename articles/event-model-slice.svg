<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 960 580" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr-down" markerWidth="6" markerHeight="5" refX="3" refY="5" orient="auto">
      <path d="M0,0 L3,5 L6,0" fill="#7f8c8d"/>
    </marker>
    <marker id="arr-right" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5" fill="#e67e22"/>
    </marker>
  </defs>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- EVENT MODEL (top section)                                -->
  <!-- ════════════════════════════════════════════════════════ -->

  <!-- Lane backgrounds -->
  <rect x="90" y="30" width="860" height="60" rx="4" fill="#3498db" opacity="0.05"/>
  <rect x="90" y="106" width="860" height="60" rx="4" fill="#e67e22" opacity="0.05"/>
  <rect x="90" y="182" width="860" height="60" rx="4" fill="#27ae60" opacity="0.05"/>

  <!-- Lane labels -->
  <text x="80" y="64" text-anchor="end" font-size="11" font-weight="600" fill="#3498db">Commands</text>
  <text x="80" y="140" text-anchor="end" font-size="11" font-weight="600" fill="#e67e22">Events</text>
  <text x="80" y="206" text-anchor="end" font-size="11" font-weight="600" fill="#27ae60">Read</text>
  <text x="80" y="220" text-anchor="end" font-size="11" font-weight="600" fill="#27ae60">Models</text>

  <!-- ===== SLICE 1: Submit Article ===== -->
  <rect x="115" y="40" width="130" height="34" rx="5" fill="#3498db"/>
  <text x="180" y="62" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">Submit Article</text>
  <line x1="180" y1="74" x2="180" y2="114" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arr-down)"/>
  <rect x="110" y="116" width="140" height="34" rx="5" fill="#e67e22"/>
  <text x="180" y="138" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">Article Submitted</text>
  <line x1="180" y1="150" x2="180" y2="190" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arr-down)"/>
  <rect x="125" y="192" width="110" height="34" rx="5" fill="#27ae60"/>
  <text x="180" y="214" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">Article List</text>

  <!-- Event flow 1→2 -->
  <line x1="250" y1="133" x2="300" y2="133" stroke="#e67e22" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-right)"/>

  <!-- ===== SLICE 2: Request Review ===== -->
  <rect x="310" y="40" width="130" height="34" rx="5" fill="#3498db"/>
  <text x="375" y="62" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">Request Review</text>
  <line x1="375" y1="74" x2="375" y2="114" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arr-down)"/>
  <rect x="305" y="116" width="140" height="34" rx="5" fill="#e67e22"/>
  <text x="375" y="138" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">Review Requested</text>
  <line x1="375" y1="150" x2="375" y2="190" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arr-down)"/>
  <rect x="310" y="192" width="130" height="34" rx="5" fill="#27ae60"/>
  <text x="375" y="214" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">Reviewer Queue</text>

  <!-- Event flow 2→3 -->
  <line x1="445" y1="133" x2="500" y2="133" stroke="#e67e22" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-right)"/>

  <!-- ===== SLICE 3: Submit Review (highlighted) ===== -->
  <!-- Highlight box spanning model + GWT -->
  <rect x="498" y="20" width="150" height="540" rx="6"
        fill="#2c3e50" fill-opacity="0.03" stroke="#2c3e50" stroke-width="2" stroke-dasharray="8,4"/>

  <rect x="510" y="40" width="126" height="34" rx="5" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
  <text x="573" y="62" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Submit Review</text>
  <line x1="573" y1="74" x2="573" y2="114" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arr-down)"/>
  <rect x="503" y="116" width="140" height="34" rx="5" fill="#e67e22" stroke="#d35400" stroke-width="1"/>
  <text x="573" y="138" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Review Completed</text>
  <line x1="573" y1="150" x2="573" y2="190" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arr-down)"/>
  <rect x="513" y="192" width="120" height="34" rx="5" fill="#27ae60" stroke="#1e8449" stroke-width="1"/>
  <text x="573" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Article Status</text>

  <!-- Event flow 3→4 -->
  <line x1="643" y1="133" x2="693" y2="133" stroke="#e67e22" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-right)"/>

  <!-- ===== SLICE 4: Approve Article ===== -->
  <rect x="700" y="40" width="140" height="34" rx="5" fill="#3498db"/>
  <text x="770" y="62" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">Approve Article</text>
  <line x1="770" y1="74" x2="770" y2="114" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arr-down)"/>
  <rect x="700" y="116" width="140" height="34" rx="5" fill="#e67e22"/>
  <text x="770" y="138" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">Article Approved</text>
  <line x1="770" y1="150" x2="770" y2="190" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arr-down)"/>
  <rect x="715" y="192" width="110" height="34" rx="5" fill="#27ae60"/>
  <text x="770" y="214" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">Dashboard</text>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- TIMELINE                                                 -->
  <!-- ════════════════════════════════════════════════════════ -->
  <line x1="100" y1="260" x2="880" y2="260" stroke="#bdc3c7" stroke-width="1.5"/>
  <polygon points="878,257 888,260 878,263" fill="#bdc3c7"/>
  <text x="900" y="264" font-size="10" fill="#95a5a6" font-style="italic">time</text>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- SPECIFICATION / VERIFICATION (GWT blocks below timeline) -->
  <!-- ════════════════════════════════════════════════════════ -->

  <!-- Section label -->
  <text x="80" y="296" text-anchor="end" font-size="10" font-weight="600" fill="#2c3e50">Specification</text>
  <text x="80" y="310" text-anchor="end" font-size="10" fill="#7f8c8d" font-style="italic">(verification)</text>

  <!-- ===== GWT 1: Submit Article ===== -->
  <rect x="108" y="280" width="144" height="108" rx="5" fill="#f8f9fa" stroke="#d5dbdb" stroke-width="1"/>
  <!-- Given -->
  <text x="118" y="300" font-size="10" font-weight="700" fill="#7f8c8d">Given</text>
  <text x="126" y="314" font-size="10" fill="#566573" font-style="italic">∅ (initial state)</text>
  <!-- When -->
  <text x="118" y="336" font-size="10" font-weight="700" fill="#3498db">When</text>
  <text x="126" y="350" font-size="10" fill="#2c3e50">Submit Article</text>
  <!-- Then -->
  <text x="118" y="372" font-size="10" font-weight="700" fill="#e67e22">Then</text>
  <text x="126" y="386" font-size="10" fill="#2c3e50">Article Submitted</text>

  <!-- ===== GWT 2: Request Review ===== -->
  <rect x="303" y="280" width="144" height="108" rx="5" fill="#f8f9fa" stroke="#d5dbdb" stroke-width="1"/>
  <!-- Given -->
  <text x="313" y="300" font-size="10" font-weight="700" fill="#7f8c8d">Given</text>
  <text x="321" y="314" font-size="10" fill="#566573" font-style="italic">{article submitted}</text>
  <!-- When -->
  <text x="313" y="336" font-size="10" font-weight="700" fill="#3498db">When</text>
  <text x="321" y="350" font-size="10" fill="#2c3e50">Request Review</text>
  <!-- Then -->
  <text x="313" y="372" font-size="10" font-weight="700" fill="#e67e22">Then</text>
  <text x="321" y="386" font-size="10" fill="#2c3e50">Review Requested</text>

  <!-- ===== GWT 3: Submit Review (highlighted) ===== -->
  <rect x="503" y="280" width="140" height="108" rx="5" fill="#f0f4f7" stroke="#2c3e50" stroke-width="1.5"/>
  <!-- Given -->
  <text x="513" y="300" font-size="10" font-weight="700" fill="#7f8c8d">Given</text>
  <text x="521" y="314" font-size="10" fill="#566573" font-style="italic">{article submitted,</text>
  <text x="525" y="326" font-size="10" fill="#566573" font-style="italic">review requested}</text>
  <!-- When -->
  <text x="513" y="346" font-size="10" font-weight="700" fill="#3498db">When</text>
  <text x="521" y="360" font-size="10" fill="#2c3e50">Submit Review</text>
  <!-- Then -->
  <text x="513" y="378" font-size="10" font-weight="700" fill="#e67e22">Then</text>
  <text x="521" y="392" font-size="10" fill="#2c3e50">Review Completed</text>

  <!-- ===== GWT 4: Approve Article ===== -->
  <rect x="698" y="280" width="144" height="108" rx="5" fill="#f8f9fa" stroke="#d5dbdb" stroke-width="1"/>
  <!-- Given -->
  <text x="708" y="300" font-size="10" font-weight="700" fill="#7f8c8d">Given</text>
  <text x="716" y="314" font-size="10" fill="#566573" font-style="italic">{article submitted,</text>
  <text x="720" y="326" font-size="10" fill="#566573" font-style="italic">review completed}</text>
  <!-- When -->
  <text x="708" y="346" font-size="10" font-weight="700" fill="#3498db">When</text>
  <text x="716" y="360" font-size="10" fill="#2c3e50">Approve Article</text>
  <!-- Then -->
  <text x="708" y="378" font-size="10" font-weight="700" fill="#e67e22">Then</text>
  <text x="716" y="392" font-size="10" fill="#2c3e50">Article Approved</text>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- DECIDER MAPPING ANNOTATION                               -->
  <!-- ════════════════════════════════════════════════════════ -->
  <text x="480" y="430" text-anchor="middle" font-size="10" fill="#7f8c8d" font-style="italic">decide(state, command) → events</text>
  <!-- Small connecting lines from GWT labels to Decider terms -->
  <text x="340" y="448" text-anchor="middle" font-size="9" fill="#95a5a6">Given → evolve(prior events) = state</text>
  <text x="573" y="448" text-anchor="middle" font-size="9" fill="#95a5a6">When → command input</text>
  <text x="770" y="448" text-anchor="middle" font-size="9" fill="#95a5a6">Then → events output</text>

</svg>
