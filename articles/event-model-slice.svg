<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 960 560" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto-start-reverse">
      <path d="M0,0 L7,2.5 L0,5" fill="#3498db"/>
    </marker>
    <marker id="arr-orange" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto-start-reverse">
      <path d="M0,0 L7,2.5 L0,5" fill="#e67e22"/>
    </marker>
    <marker id="arr-gray" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto-start-reverse">
      <path d="M0,0 L7,2.5 L0,5" fill="#7f8c8d"/>
    </marker>
  </defs>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- ROW LANE BACKGROUNDS                                     -->
  <!-- ════════════════════════════════════════════════════════ -->
  <rect x="88" y="36" width="860" height="72" rx="3" fill="#f4f6f7" opacity="0.6"/>
  <rect x="88" y="112" width="860" height="72" rx="3" fill="#f8f9fa" opacity="0.6"/>
  <rect x="88" y="188" width="860" height="68" rx="3" fill="#f4f6f7" opacity="0.6"/>
  <rect x="88" y="260" width="860" height="62" rx="3" fill="#f8f9fa" opacity="0.6"/>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- ROW LABELS (left side)                                   -->
  <!-- ════════════════════════════════════════════════════════ -->
  <text x="80" y="76" text-anchor="end" font-size="10" font-weight="600" fill="#566573">Publisher</text>
  <text x="80" y="152" text-anchor="end" font-size="10" font-weight="600" fill="#566573">Reviewer</text>
  <text x="80" y="218" text-anchor="end" font-size="10" font-weight="600" fill="#566573">Information</text>
  <text x="80" y="230" text-anchor="end" font-size="10" font-weight="600" fill="#566573">Flow</text>
  <text x="80" y="296" text-anchor="end" font-size="10" font-weight="600" fill="#566573">Events</text>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- COLUMN HEADERS (5 columns)                               -->
  <!-- Centers: 169, 326, 483, 640, 797                         -->
  <!-- ════════════════════════════════════════════════════════ -->
  <text x="169" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#2c3e50">Submit Article</text>
  <text x="326" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#2c3e50">Article List</text>
  <text x="483" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#2c3e50">Article for Review</text>
  <text x="640" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#2c3e50">Submit Review</text>
  <text x="797" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#2c3e50">Article Status</text>
  <!-- Slice type labels -->
  <text x="169" y="30" text-anchor="middle" font-size="8" fill="#95a5a6" font-style="italic">state change</text>
  <text x="326" y="30" text-anchor="middle" font-size="8" fill="#95a5a6" font-style="italic">state view</text>
  <text x="483" y="30" text-anchor="middle" font-size="8" fill="#95a5a6" font-style="italic">state view</text>
  <text x="640" y="30" text-anchor="middle" font-size="8" fill="#95a5a6" font-style="italic">state change</text>
  <text x="797" y="30" text-anchor="middle" font-size="8" fill="#95a5a6" font-style="italic">state view</text>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- HIGHLIGHT: Col 4 (Submit Review) dashed border           -->
  <!-- ════════════════════════════════════════════════════════ -->
  <rect x="570" y="6" width="140" height="530" rx="6"
        fill="#2c3e50" fill-opacity="0.02" stroke="#2c3e50" stroke-width="1.8" stroke-dasharray="8,4"/>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- COL 1: Submit Article (State Change)                     -->
  <!-- x: 95..244, center: 169                                  -->
  <!-- ════════════════════════════════════════════════════════ -->

  <!-- Publisher row: Submit form wireframe -->
  <rect x="124" y="46" width="90" height="50" rx="4" fill="#fff" stroke="#95a5a6" stroke-width="1"/>
  <rect x="132" y="53" width="44" height="5" rx="1" fill="#d5dbdb"/>
  <rect x="132" y="63" width="72" height="5" rx="1" fill="#eaecee"/>
  <rect x="132" y="73" width="72" height="5" rx="1" fill="#eaecee"/>
  <rect x="132" y="83" width="30" height="7" rx="2" fill="#3498db" opacity="0.4"/>

  <!-- Arrow: Publisher UI → Command (down, gray dashed) -->
  <line x1="169" y1="96" x2="169" y2="196" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>

  <!-- Info Flow row: Command (blue) -->
  <rect x="114" y="198" width="110" height="36" rx="5" fill="#3498db"/>
  <text x="169" y="220" text-anchor="middle" font-size="10" font-weight="500" fill="#fff">Submit Article</text>

  <!-- Arrow: Command → Event (down, blue) -->
  <line x1="169" y1="234" x2="169" y2="270" stroke="#3498db" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Events row: ArticleSubmitted (orange) -->
  <rect x="104" y="272" width="130" height="34" rx="5" fill="#e67e22"/>
  <text x="169" y="293" text-anchor="middle" font-size="10" font-weight="500" fill="#fff">ArticleSubmitted</text>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- COL 2: Article List (State View)                         -->
  <!-- x: 252..401, center: 326                                 -->
  <!-- ════════════════════════════════════════════════════════ -->

  <!-- Publisher row: Article list wireframe -->
  <rect x="281" y="46" width="90" height="50" rx="4" fill="#fff" stroke="#95a5a6" stroke-width="1"/>
  <rect x="289" y="53" width="50" height="5" rx="1" fill="#d5dbdb"/>
  <line x1="289" y1="63" x2="363" y2="63" stroke="#eaecee" stroke-width="1"/>
  <rect x="289" y="67" width="72" height="5" rx="1" fill="#eaecee"/>
  <line x1="289" y1="77" x2="363" y2="77" stroke="#eaecee" stroke-width="1"/>
  <rect x="289" y="81" width="72" height="5" rx="1" fill="#eaecee"/>

  <!-- Arrow: View → Publisher UI (up, gray dashed) -->
  <line x1="326" y1="196" x2="326" y2="100" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>

  <!-- Info Flow row: View (green) -->
  <rect x="271" y="198" width="110" height="36" rx="5" fill="#27ae60"/>
  <text x="326" y="220" text-anchor="middle" font-size="10" font-weight="500" fill="#fff">Article List</text>

  <!-- Arrow: Event (col 1) → View (col 2) (diagonal, orange) -->
  <path d="M234,286 C280,286 275,230 271,220" fill="none" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arr-orange)"/>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- COL 3: Article for Review (State View)                   -->
  <!-- x: 409..558, center: 483                                 -->
  <!-- ════════════════════════════════════════════════════════ -->

  <!-- Reviewer row: Article detail wireframe -->
  <rect x="438" y="122" width="90" height="50" rx="4" fill="#fff" stroke="#95a5a6" stroke-width="1"/>
  <rect x="446" y="129" width="50" height="5" rx="1" fill="#d5dbdb"/>
  <rect x="446" y="139" width="72" height="5" rx="1" fill="#eaecee"/>
  <rect x="446" y="149" width="72" height="5" rx="1" fill="#eaecee"/>
  <rect x="446" y="159" width="72" height="5" rx="1" fill="#eaecee"/>

  <!-- Arrow: View → Reviewer UI (up, gray dashed) -->
  <line x1="483" y1="196" x2="483" y2="176" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>

  <!-- Info Flow row: View (green) -->
  <rect x="423" y="198" width="120" height="36" rx="5" fill="#27ae60"/>
  <text x="483" y="220" text-anchor="middle" font-size="10" font-weight="500" fill="#fff">Article for Review</text>

  <!-- Arrow: Event (col 1) → View (col 3) (diagonal, orange) -->
  <path d="M234,289 C340,289 390,240 423,222" fill="none" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arr-orange)"/>

  <!-- Arrow: Reviewer UI (col 3) → Command (col 4) (diagonal right-down, gray dashed) -->
  <path d="M528,155 C560,155 575,175 595,196" fill="none" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- COL 4: Submit Review (State Change) — HIGHLIGHTED        -->
  <!-- x: 566..715, center: 640                                 -->
  <!-- ════════════════════════════════════════════════════════ -->

  <!-- Info Flow row: Command (blue) -->
  <rect x="585" y="198" width="110" height="36" rx="5" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
  <text x="640" y="220" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Submit Review</text>

  <!-- Arrow: Command → Event (down, blue) -->
  <line x1="640" y1="234" x2="640" y2="270" stroke="#3498db" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Events row: ReviewCompleted (orange) -->
  <rect x="575" y="272" width="130" height="34" rx="5" fill="#e67e22" stroke="#d35400" stroke-width="1"/>
  <text x="640" y="293" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">ReviewCompleted</text>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- COL 5: Article Status (State View)                       -->
  <!-- x: 723..872, center: 797                                 -->
  <!-- ════════════════════════════════════════════════════════ -->

  <!-- Reviewer row: Status dashboard wireframe -->
  <rect x="752" y="122" width="90" height="50" rx="4" fill="#fff" stroke="#95a5a6" stroke-width="1"/>
  <rect x="760" y="129" width="50" height="5" rx="1" fill="#d5dbdb"/>
  <line x1="760" y1="139" x2="834" y2="139" stroke="#eaecee" stroke-width="1"/>
  <rect x="760" y="143" width="26" height="5" rx="1" fill="#27ae60" opacity="0.4"/>
  <rect x="792" y="143" width="36" height="5" rx="1" fill="#eaecee"/>
  <line x1="760" y1="153" x2="834" y2="153" stroke="#eaecee" stroke-width="1"/>
  <rect x="760" y="157" width="26" height="5" rx="1" fill="#e67e22" opacity="0.4"/>
  <rect x="792" y="157" width="36" height="5" rx="1" fill="#eaecee"/>

  <!-- Arrow: View → Reviewer UI (up, gray dashed) -->
  <line x1="797" y1="196" x2="797" y2="176" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>

  <!-- Info Flow row: View (green) -->
  <rect x="737" y="198" width="120" height="36" rx="5" fill="#27ae60"/>
  <text x="797" y="220" text-anchor="middle" font-size="10" font-weight="500" fill="#fff">Article Status</text>

  <!-- Arrow: Event (col 4) → View (col 5) (diagonal, orange) -->
  <path d="M705,286 C740,286 740,240 737,222" fill="none" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arr-orange)"/>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- TIMELINE SEPARATOR                                       -->
  <!-- ════════════════════════════════════════════════════════ -->
  <line x1="90" y1="336" x2="930" y2="336" stroke="#bdc3c7" stroke-width="1.2"/>
  <polygon points="928,333 938,336 928,339" fill="#bdc3c7"/>
  <text x="944" y="340" font-size="8" fill="#95a5a6" font-style="italic">time</text>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- GWT SPECIFICATION CARDS (below timeline)                 -->
  <!-- ════════════════════════════════════════════════════════ -->

  <!-- Section label -->
  <text x="80" y="374" text-anchor="end" font-size="9" font-weight="600" fill="#2c3e50">Specification</text>
  <text x="80" y="386" text-anchor="end" font-size="9" fill="#7f8c8d" font-style="italic">(verification)</text>

  <!-- GWT 1: Submit Article (State Change) -->
  <rect x="100" y="356" width="138" height="88" rx="5" fill="#f8f9fa" stroke="#d5dbdb" stroke-width="1"/>
  <text x="109" y="372" font-size="8" font-weight="700" fill="#7f8c8d">Given</text>
  <text x="116" y="383" font-size="8" fill="#566573" font-style="italic">∅ (initial state)</text>
  <text x="109" y="399" font-size="8" font-weight="700" fill="#3498db">When</text>
  <text x="116" y="410" font-size="8" fill="#2c3e50">Submit Article</text>
  <text x="109" y="426" font-size="8" font-weight="700" fill="#e67e22">Then</text>
  <text x="116" y="437" font-size="8" fill="#2c3e50">ArticleSubmitted</text>

  <!-- GWT 2: Article List (State View) -->
  <rect x="257" y="356" width="138" height="68" rx="5" fill="#f8f9fa" stroke="#d5dbdb" stroke-width="1"/>
  <text x="266" y="372" font-size="8" font-weight="700" fill="#7f8c8d">Given</text>
  <text x="273" y="383" font-size="8" fill="#566573" font-style="italic">ArticleSubmitted</text>
  <text x="266" y="405" font-size="8" font-weight="700" fill="#27ae60">Then</text>
  <text x="273" y="416" font-size="8" fill="#2c3e50">Article List (view)</text>

  <!-- GWT 3: Article for Review (State View) -->
  <rect x="414" y="356" width="138" height="68" rx="5" fill="#f8f9fa" stroke="#d5dbdb" stroke-width="1"/>
  <text x="423" y="372" font-size="8" font-weight="700" fill="#7f8c8d">Given</text>
  <text x="430" y="383" font-size="8" fill="#566573" font-style="italic">ArticleSubmitted</text>
  <text x="423" y="405" font-size="8" font-weight="700" fill="#27ae60">Then</text>
  <text x="430" y="416" font-size="8" fill="#2c3e50">Article for Review (view)</text>

  <!-- GWT 4: Submit Review (State Change) — highlighted -->
  <rect x="576" y="356" width="128" height="88" rx="5" fill="#f0f4f7" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="585" y="372" font-size="8" font-weight="700" fill="#7f8c8d">Given</text>
  <text x="592" y="383" font-size="8" fill="#566573" font-style="italic">{article submitted}</text>
  <text x="585" y="399" font-size="8" font-weight="700" fill="#3498db">When</text>
  <text x="592" y="410" font-size="8" fill="#2c3e50">Submit Review</text>
  <text x="585" y="426" font-size="8" font-weight="700" fill="#e67e22">Then</text>
  <text x="592" y="437" font-size="8" fill="#2c3e50">ReviewCompleted</text>

  <!-- GWT 5: Article Status (State View) -->
  <rect x="728" y="356" width="138" height="88" rx="5" fill="#f8f9fa" stroke="#d5dbdb" stroke-width="1"/>
  <text x="737" y="372" font-size="8" font-weight="700" fill="#7f8c8d">Given</text>
  <text x="744" y="383" font-size="8" fill="#566573" font-style="italic">ArticleSubmitted,</text>
  <text x="744" y="394" font-size="8" fill="#566573" font-style="italic">ReviewCompleted</text>
  <text x="737" y="416" font-size="8" font-weight="700" fill="#27ae60">Then</text>
  <text x="744" y="427" font-size="8" fill="#2c3e50">Article Status (view)</text>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- DECIDER ANNOTATION                                       -->
  <!-- ════════════════════════════════════════════════════════ -->
  <text x="480" y="550" text-anchor="middle" font-size="8" fill="#95a5a6" font-style="italic">State Change: decide(state, command) → events · State View: project(events) → view</text>

</svg>
