<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="sans-serif">
  <!-- out of git -->
  <text x="165" y="50" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">out of git</text>
  <text x="165" y="70" text-anchor="middle" font-size="12" fill="#777">1,734 lines of markup, judgment smeared through</text>
  <rect x="70" y="90" width="190" height="103" fill="#dcdcdc" stroke="#b5b5b5"/>
  <text x="165" y="147" text-anchor="middle" font-size="13" fill="#444">auction screens · −646</text>
  <rect x="70" y="193" width="190" height="76" fill="#d0d0d0" stroke="#b5b5b5"/>
  <text x="165" y="236" text-anchor="middle" font-size="13" fill="#444">arithmetic screens · −477</text>
  <rect x="70" y="269" width="190" height="98" fill="#c4c4c4" stroke="#b5b5b5"/>
  <text x="165" y="323" text-anchor="middle" font-size="13" fill="#444">quiz screens · −611</text>
  <!-- arrow -->
  <path d="M285,210 L370,210 L370,193 L405,228 L370,263 L370,246 L285,246 Z" fill="#c9c9c9"/>
  <text x="345" y="290" text-anchor="middle" font-size="12" fill="#777">net −408</text>
  <!-- into git -->
  <text x="515" y="50" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">into git</text>
  <text x="515" y="70" text-anchor="middle" font-size="12" fill="#777">1,326 lines</text>
  <rect x="420" y="90" width="190" height="146" fill="#5b8ac2" stroke="#41689a"/>
  <text x="515" y="155" text-anchor="middle" font-size="13" fill="#fff">per-game residue · +914</text>
  <text x="515" y="173" text-anchor="middle" font-size="11" fill="#dfe9f5">judgment only, pure functions</text>
  <rect x="420" y="236" width="190" height="59" fill="#7aa3cf" stroke="#41689a"/>
  <text x="515" y="270" text-anchor="middle" font-size="13" fill="#fff">shared interpreter · +369</text>
  <rect x="420" y="295" width="190" height="7" fill="#a5c0de" stroke="#41689a"/>
  <line x1="612" y1="298" x2="638" y2="298" stroke="#888"/>
  <text x="644" y="302" font-size="12" fill="#666">startup catalog · +43</text>
  <!-- the spec itself -->
  <rect x="680" y="90" width="150" height="128" fill="#f4d06f" stroke="#c9a227"/>
  <text x="755" y="148" text-anchor="middle" font-size="13" fill="#5c4a12">xm YAML · ~800</text>
  <text x="755" y="238" text-anchor="middle" font-size="12" fill="#777">the spec itself,</text>
  <text x="755" y="254" text-anchor="middle" font-size="12" fill="#777">not a restatement</text>
</svg>
