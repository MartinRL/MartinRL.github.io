<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" font-family="sans-serif">
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <!-- stage gridlines -->
  <line x1="270" y1="40" x2="270" y2="560" stroke="#e8e8e8" stroke-dasharray="2 4"/>
  <line x1="470" y1="40" x2="470" y2="560" stroke="#e8e8e8" stroke-dasharray="2 4"/>
  <line x1="670" y1="40" x2="670" y2="560" stroke="#e8e8e8" stroke-dasharray="2 4"/>
  <!-- axes -->
  <line x1="70" y1="40" x2="70" y2="560" stroke="#999" stroke-width="1.5"/>
  <line x1="70" y1="560" x2="870" y2="560" stroke="#999" stroke-width="1.5"/>
  <text x="8" y="55" font-size="11" fill="#999">visible</text>
  <text x="8" y="555" font-size="11" fill="#999">invisible</text>
  <text transform="rotate(-90 30 300)" x="30" y="300" text-anchor="middle" font-size="13" fill="#999">value chain</text>
  <text x="170" y="584" text-anchor="middle" font-size="13" fill="#555">novel</text>
  <text x="370" y="584" text-anchor="middle" font-size="13" fill="#555">emerging</text>
  <text x="570" y="584" text-anchor="middle" font-size="13" fill="#555">good practice</text>
  <text x="770" y="584" text-anchor="middle" font-size="13" fill="#555">best practice</text>
  <text x="470" y="612" text-anchor="middle" font-size="12" fill="#999">evolution of the practice, as performed</text>
  <!-- uncoached base components, dimmed -->
  <g stroke="#e5e5e5" stroke-width="1">
    <line x1="430" y1="75" x2="240" y2="155"/>
    <line x1="430" y1="75" x2="400" y2="175"/>
    <line x1="400" y1="175" x2="480" y2="235"/>
    <line x1="480" y1="235" x2="430" y2="355"/>
    <line x1="480" y1="235" x2="500" y2="290"/>
  </g>
  <g fill="#fff" stroke="#c9c9c9" stroke-width="1.5">
    <circle cx="240" cy="155" r="6"/>
    <circle cx="400" cy="175" r="6"/>
    <circle cx="480" cy="235" r="6"/>
    <circle cx="500" cy="290" r="6"/>
    <circle cx="430" cy="355" r="6"/>
    <circle cx="360" cy="395" r="6"/>
    <circle cx="710" cy="470" r="6"/>
    <circle cx="660" cy="515" r="6"/>
    <circle cx="770" cy="540" r="6"/>
  </g>
  <text x="240" y="138" text-anchor="middle" font-size="13" fill="#aaa">the kill or ship call</text>
  <!-- anchor -->
  <circle cx="430" cy="75" r="7" fill="#333"/>
  <text x="430" y="52" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">discover solutions that are valuable and viable</text>
  <!-- coached components: actual (filled), target (hollow), movement arrows -->
  <!-- customer knowledge -->
  <line x1="212" y1="300" x2="503" y2="300" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)"/>
  <circle cx="200" cy="300" r="6" fill="#1d4ed8"/>
  <circle cx="520" cy="300" r="6" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="200" y="283" text-anchor="middle" font-size="13" fill="#1d4ed8">customer knowledge</text>
  <!-- data knowledge, inertia: BI team queue -->
  <line x1="312" y1="345" x2="593" y2="345" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)"/>
  <rect x="428" y="331" width="5" height="28" fill="#333"/>
  <circle cx="300" cy="345" r="6" fill="#1d4ed8"/>
  <circle cx="610" cy="345" r="6" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="300" y="328" text-anchor="middle" font-size="13" fill="#1d4ed8">data knowledge</text>
  <text x="430" y="374" text-anchor="middle" font-size="12" font-style="italic" fill="#555">every question queues behind the BI team</text>
  <!-- discovery techniques -->
  <line x1="392" y1="415" x2="623" y2="415" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)"/>
  <circle cx="380" cy="415" r="6" fill="#1d4ed8"/>
  <circle cx="640" cy="415" r="6" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="380" y="398" text-anchor="middle" font-size="13" fill="#1d4ed8">discovery techniques</text>
  <!-- access to users and buyers, inertia: sales gatekeeps -->
  <line x1="362" y1="480" x2="603" y2="480" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)"/>
  <rect x="478" y="466" width="5" height="28" fill="#333"/>
  <circle cx="350" cy="480" r="6" fill="#1d4ed8"/>
  <circle cx="620" cy="480" r="6" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="350" y="463" text-anchor="middle" font-size="13" fill="#1d4ed8">access to users and buyers</text>
  <text x="480" y="512" text-anchor="middle" font-size="12" font-style="italic" fill="#555">sales gatekeeps buyer relationships</text>
  <!-- legend -->
  <g font-size="12" fill="#555">
    <circle cx="655" cy="95" r="5" fill="#1d4ed8"/>
    <text x="668" y="99">practice as performed today</text>
    <circle cx="655" cy="117" r="5" fill="none" stroke="#1d4ed8" stroke-width="2"/>
    <text x="668" y="121">localized target</text>
    <rect x="651" y="132" width="5" height="14" fill="#333"/>
    <text x="668" y="143">inertia</text>
  </g>
</svg>
