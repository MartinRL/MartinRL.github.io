<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="sans-serif">
  <!-- unguarded request column -->
  <rect x="688" y="60" width="150" height="236" fill="#fbeeee"/>
  <rect x="688" y="60" width="150" height="236" fill="none" stroke="#d9a0a0" stroke-dasharray="6 4"/>
  <!-- station gridlines -->
  <line x1="230" y1="56" x2="230" y2="296" stroke="#e8e8e8" stroke-dasharray="2 4"/>
  <line x1="410" y1="56" x2="410" y2="296" stroke="#e8e8e8" stroke-dasharray="2 4"/>
  <line x1="590" y1="56" x2="590" y2="296" stroke="#e8e8e8" stroke-dasharray="2 4"/>
  <!-- station headers -->
  <text x="230" y="44" text-anchor="middle" font-size="15" fill="#555">plan</text>
  <text x="410" y="44" text-anchor="middle" font-size="15" fill="#555">build / CI</text>
  <text x="590" y="44" text-anchor="middle" font-size="15" fill="#555">boot</text>
  <text x="763" y="44" text-anchor="middle" font-size="15" fill="#555">request</text>
  <!-- row 1: part one -->
  <text x="20" y="116" font-size="15" font-weight="bold" fill="#333">Part one</text>
  <text x="20" y="134" font-size="12" fill="#777">domain strata</text>
  <line x1="180" y1="126" x2="838" y2="126" stroke="#c4c4c4" stroke-width="2"/>
  <circle cx="410" cy="126" r="7" fill="#1d4ed8"/>
  <text x="410" y="152" text-anchor="middle" font-size="13" fill="#1d4ed8">the compiler</text>
  <text x="410" y="168" text-anchor="middle" font-size="12" fill="#666">CS8795; failures cannot leave the build machine</text>
  <!-- row 2: part two -->
  <text x="20" y="226" font-size="15" font-weight="bold" fill="#333">Part two</text>
  <text x="20" y="244" font-size="12" fill="#777">experience layer</text>
  <line x1="180" y1="236" x2="838" y2="236" stroke="#c4c4c4" stroke-width="2"/>
  <circle cx="230" cy="236" r="7" fill="#0e7a4e"/>
  <text x="230" y="262" text-anchor="middle" font-size="13" fill="#0e7a4e">closed vocabulary</text>
  <text x="230" y="278" text-anchor="middle" font-size="12" fill="#666">six field kinds, plan-level</text>
  <circle cx="410" cy="236" r="7" fill="#0e7a4e"/>
  <text x="410" y="262" text-anchor="middle" font-size="13" fill="#0e7a4e">characterization suite</text>
  <text x="410" y="278" text-anchor="middle" font-size="12" fill="#666">47 endpoint tests</text>
  <circle cx="590" cy="236" r="7" fill="#0e7a4e"/>
  <text x="590" y="262" text-anchor="middle" font-size="13" fill="#0e7a4e">startup lint</text>
  <text x="590" y="278" text-anchor="middle" font-size="12" fill="#666">a broken spec fails the deploy</text>
  <circle cx="763" cy="236" r="7" fill="none" stroke="#c05050" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="763" y="262" text-anchor="middle" font-size="13" fill="#c05050">unguarded</text>
</svg>
