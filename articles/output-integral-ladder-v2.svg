<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Output, sustained output, outcome, impact: four rungs on one time axis. Agents move only the first.</title>
  <defs>
    <marker id="axisArr" markerWidth="10" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#16213E"/></marker>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- lane separators -->
  <line x1="140" y1="190" x2="900" y2="190" stroke="#e9ecef" stroke-width="1"/>
  <line x1="140" y1="320" x2="900" y2="320" stroke="#e9ecef" stroke-width="1"/>
  <line x1="140" y1="450" x2="900" y2="450" stroke="#e9ecef" stroke-width="1"/>

  <!-- AI adoption marker -->
  <line x1="300" y1="50" x2="300" y2="580" stroke="#868e96" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="300" y="40" font-size="12.5" font-weight="bold" font-style="italic" fill="#16213E" text-anchor="middle">AI adoption</text>

  <!-- time axis -->
  <line x1="140" y1="585" x2="900" y2="585" stroke="#16213E" stroke-width="2" marker-end="url(#axisArr)"/>
  <text x="520" y="606" font-size="13" font-weight="bold" font-style="italic" fill="#16213E" text-anchor="middle">time</text>

  <!-- 1 OUTPUT: a ~60deg ramp to Nx -->
  <text x="130" y="125" font-size="14" font-weight="bold" fill="#1F3864" text-anchor="end">1 · OUTPUT</text>
  <path d="M140,170 L300,170 L346,90 L900,90" fill="none" stroke="#1F3864" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="358" y="80" font-size="12.5" font-weight="bold" fill="#1F3864">agents: m×</text>
  <text x="920" y="112" font-size="16" font-weight="bold" fill="#1F3864">OUTPUT · easy</text>
  <text x="920" y="132" font-size="12.5" fill="#343a40">code and features shipped; the rate</text>
  <text x="920" y="149" font-size="12.5" fill="#343a40">agents lift m× over a few quarters</text>

  <!-- 2 SUSTAINED OUTPUT: the integral, with and without 1/N -->
  <text x="130" y="255" font-size="14" font-weight="bold" fill="#7030A0" text-anchor="end">2 · SUSTAINED</text>
  <text x="130" y="272" font-size="14" font-weight="bold" fill="#7030A0" text-anchor="end">OUTPUT</text>
  <path d="M140,305 L300,290 C420,240 600,215 900,205 L900,310 L140,310 Z" fill="#7030A0" fill-opacity="0.12" stroke="none"/>
  <path d="M140,305 L300,290 C420,240 600,215 900,205" fill="none" stroke="#7030A0" stroke-width="5" stroke-linecap="round"/>
  <path d="M300,290 C380,255 440,265 520,285 C600,305 700,308 900,309" fill="none" stroke="#7030A0" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round"/>
  <text x="640" y="200" font-size="12.5" font-weight="bold" fill="#7030A0">k = 1/m holds: the area keeps growing</text>
  <text x="470" y="328" font-size="12.5" fill="#7030A0">upkeep drain wins: the m× evaporates</text>
  <text x="920" y="242" font-size="16" font-weight="bold" fill="#7030A0">SUSTAINED OUTPUT · hard</text>
  <text x="920" y="262" font-size="12.5" fill="#343a40">output integrated over time: what shipped</text>
  <text x="920" y="279" font-size="12.5" fill="#343a40">still runs, is understood, changes safely.</text>
  <text x="920" y="296" font-size="12.5" font-weight="bold" fill="#7030A0">upkeep: k = 1/m or bust</text>

  <!-- 3 OUTCOME: lagging S-curve -->
  <text x="130" y="390" font-size="14" font-weight="bold" fill="#16213E" text-anchor="end">3 · OUTCOME</text>
  <path d="M140,438 L450,436 C560,432 620,360 720,345 C800,335 860,333 900,332" fill="none" stroke="#16213E" stroke-width="5" stroke-linecap="round"/>
  <text x="920" y="372" font-size="16" font-weight="bold" fill="#16213E">OUTCOME · harder</text>
  <text x="920" y="392" font-size="12.5" fill="#343a40">customers change behavior; adoption</text>
  <text x="920" y="409" font-size="12.5" fill="#343a40">follows the stock, never the rate</text>

  <!-- 4 IMPACT: lags further, climbs slower -->
  <text x="130" y="520" font-size="14" font-weight="bold" fill="#16213E" text-anchor="end">4 · IMPACT</text>
  <path d="M140,568 L600,566 C700,562 790,530 900,500" fill="none" stroke="#16213E" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 0"/>
  <text x="920" y="502" font-size="16" font-weight="bold" fill="#16213E">IMPACT · hardest</text>
  <text x="920" y="522" font-size="12.5" fill="#343a40">the P&amp;L: what is left of m after three</text>
  <text x="920" y="539" font-size="12.5" fill="#343a40">discounts: sustain, adoption, cohort</text>

</svg>
