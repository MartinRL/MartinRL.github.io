<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 960 380" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto-start-reverse">
      <path d="M0,0 L7,2.5 L0,5" fill="#3498db"/>
    </marker>
    <marker id="arr-orange" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto-start-reverse">
      <path d="M0,0 L7,2.5 L0,5" fill="#e67e22"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto-start-reverse">
      <path d="M0,0 L7,2.5 L0,5" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto-start-reverse">
      <path d="M0,0 L7,2.5 L0,5" fill="#c0392b"/>
    </marker>
    <marker id="arr-dark" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto-start-reverse">
      <path d="M0,0 L7,2.5 L0,5" fill="#2c3e50"/>
    </marker>
  </defs>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- TIMELINE                                                 -->
  <!-- ════════════════════════════════════════════════════════ -->
  <line x1="60" y1="160" x2="900" y2="160" stroke="#2c3e50" stroke-width="1.5"/>
  <polygon points="898,157 908,160 898,163" fill="#2c3e50"/>

  <!-- Phase labels on timeline -->
  <text x="175" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#2c3e50">Design-time</text>
  <text x="480" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#2c3e50">Implementation-time</text>
  <text x="780" y="175" text-anchor="middle" font-size="11" font-weight="700" fill="#2c3e50">Runtime</text>

  <!-- Phase dividers -->
  <line x1="330" y1="140" x2="330" y2="180" stroke="#d5dbdb" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="630" y1="140" x2="630" y2="180" stroke="#d5dbdb" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- LOOP 1: Design-time (blue)                               -->
  <!-- ════════════════════════════════════════════════════════ -->
  <!-- Circular loop arrow -->
  <circle cx="175" cy="80" r="45" fill="#3498db" fill-opacity="0.06" stroke="#3498db" stroke-width="2"/>
  <path d="M175,35 A45,45 0 1,1 130,80" fill="none" stroke="#3498db" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Loop label -->
  <text x="175" y="76" text-anchor="middle" font-size="10" font-weight="600" fill="#3498db">Decider</text>
  <text x="175" y="90" text-anchor="middle" font-size="10" font-weight="600" fill="#3498db">simulation</text>

  <!-- Input (above-left) -->
  <text x="100" y="28" font-size="9" fill="#566573">Input:</text>
  <text x="100" y="40" font-size="9" font-weight="500" fill="#2c3e50">Event Model + scenarios</text>

  <!-- Output (below) -->
  <rect x="120" y="198" width="110" height="28" rx="4" fill="#3498db" fill-opacity="0.1" stroke="#3498db" stroke-width="1"/>
  <text x="175" y="216" text-anchor="middle" font-size="9" font-weight="600" fill="#3498db">Verified design</text>

  <!-- Connector: loop → output -->
  <line x1="175" y1="125" x2="175" y2="196" stroke="#3498db" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- LOOP 2: Implementation-time (orange)                     -->
  <!-- ════════════════════════════════════════════════════════ -->
  <!-- Circular loop arrow -->
  <circle cx="480" cy="80" r="45" fill="#e67e22" fill-opacity="0.06" stroke="#e67e22" stroke-width="2"/>
  <path d="M480,35 A45,45 0 1,1 435,80" fill="none" stroke="#e67e22" stroke-width="2" marker-end="url(#arr-orange)"/>

  <!-- Loop label -->
  <text x="480" y="76" text-anchor="middle" font-size="10" font-weight="600" fill="#e67e22">Eval set</text>
  <text x="480" y="90" text-anchor="middle" font-size="9" fill="#d35400">(EM + Ops + Policy)</text>

  <!-- Input (above-left) -->
  <text x="405" y="28" font-size="9" fill="#566573">Input:</text>
  <text x="405" y="40" font-size="9" font-weight="500" fill="#2c3e50">Generated code</text>

  <!-- Output (below) -->
  <rect x="430" y="198" width="100" height="28" rx="4" fill="#e67e22" fill-opacity="0.1" stroke="#e67e22" stroke-width="1"/>
  <text x="480" y="216" text-anchor="middle" font-size="9" font-weight="600" fill="#e67e22">Pass / Fail</text>

  <!-- Connector: loop → output -->
  <line x1="480" y1="125" x2="480" y2="196" stroke="#e67e22" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-orange)"/>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- LOOP 3: Runtime (green)                                  -->
  <!-- ════════════════════════════════════════════════════════ -->
  <!-- Circular loop arrow -->
  <circle cx="780" cy="80" r="45" fill="#27ae60" fill-opacity="0.06" stroke="#27ae60" stroke-width="2"/>
  <path d="M780,35 A45,45 0 1,1 735,80" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Loop label -->
  <text x="780" y="76" text-anchor="middle" font-size="10" font-weight="600" fill="#27ae60">Drift</text>
  <text x="780" y="90" text-anchor="middle" font-size="10" font-weight="600" fill="#27ae60">detection</text>

  <!-- Input (above-left) -->
  <text x="710" y="28" font-size="9" fill="#566573">Input:</text>
  <text x="710" y="40" font-size="9" font-weight="500" fill="#2c3e50">Live events</text>

  <!-- Output (below) -->
  <rect x="720" y="198" width="120" height="28" rx="4" fill="#27ae60" fill-opacity="0.1" stroke="#27ae60" stroke-width="1"/>
  <text x="780" y="216" text-anchor="middle" font-size="9" font-weight="600" fill="#27ae60">Divergence alerts</text>

  <!-- Connector: loop → output -->
  <line x1="780" y1="125" x2="780" y2="196" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- TIMELINE ARROWS between loops                            -->
  <!-- ════════════════════════════════════════════════════════ -->
  <line x1="230" y1="160" x2="420" y2="160" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <line x1="540" y1="160" x2="720" y2="160" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- FEEDBACK ARROW: Loop 3 → Loop 1                          -->
  <!-- ════════════════════════════════════════════════════════ -->
  <path d="M780,228 L780,290 L175,290 L175,228" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arr-red)"/>
  <text x="480" y="284" text-anchor="middle" font-size="9" fill="#c0392b" font-style="italic">production observations refine scenarios</text>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- DATADOG REFERENCE                                        -->
  <!-- ════════════════════════════════════════════════════════ -->
  <text x="780" y="330" text-anchor="middle" font-size="8" fill="#95a5a6" font-style="italic">cf. Datadog: TLA+ → simulation →</text>
  <text x="780" y="342" text-anchor="middle" font-size="8" fill="#95a5a6" font-style="italic">model checking → telemetry</text>

</svg>
