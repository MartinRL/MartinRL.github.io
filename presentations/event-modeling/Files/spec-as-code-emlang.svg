<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5a6a7a"/>
    </marker>
  </defs>

  <!-- Center node: emlang -->
  <rect x="120" y="30" rx="10" ry="10" width="200" height="76" fill="#fef3c7" stroke="#d69e2e" stroke-width="2"/>
  <text x="220" y="58" text-anchor="middle" font-size="16" font-weight="bold" fill="#744210">emlang</text>
  <text x="220" y="78" text-anchor="middle" font-size="11" fill="#744210">specification &amp; verification</text>
  <text x="220" y="94" text-anchor="middle" font-size="12" fill="#744210">as .yaml</text>

  <!-- Arrow: center → left output -->
  <line x1="178" y1="106" x2="110" y2="194" stroke="#5a6a7a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Arrow: center → right output -->
  <line x1="262" y1="106" x2="330" y2="194" stroke="#5a6a7a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Left output: Visual Event Models -->
  <rect x="15" y="200" rx="10" ry="10" width="180" height="52" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="105" y="231" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a5f">Visual Event Models</text>

  <!-- Right output: GWTs / GTs (BDD tests) -->
  <rect x="245" y="200" rx="10" ry="10" width="180" height="52" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="335" y="223" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">GWTs / GTs</text>
  <text x="335" y="241" text-anchor="middle" font-size="11" fill="#065f46">(BDD tests)</text>
</svg>
