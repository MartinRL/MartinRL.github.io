<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 680" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5a6a7a"/>
    </marker>
  </defs>

  <!-- Step 1: Event Model Slices -->
  <rect x="60" y="10" rx="10" ry="10" width="360" height="88" fill="#fef3c7" stroke="#d69e2e" stroke-width="2"/>
  <text x="240" y="34" text-anchor="middle" font-size="14" font-weight="bold" fill="#744210">Event Model Slices</text>
  <text x="240" y="50" text-anchor="middle" font-size="10" fill="#744210">structurally uniform — same 4 patterns</text>
  <!-- 4 mini pattern boxes -->
  <rect x="78" y="60" rx="3" ry="3" width="74" height="28" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="115" y="79" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e3a5f">State Change</text>
  <rect x="160" y="60" rx="3" ry="3" width="74" height="28" fill="#c6f6d5" stroke="#38a169" stroke-width="1.5"/>
  <text x="197" y="79" text-anchor="middle" font-size="9" font-weight="bold" fill="#276749">State View</text>
  <rect x="242" y="60" rx="3" ry="3" width="74" height="28" fill="#bee3f8" stroke="#3182ce" stroke-width="1.5"/>
  <text x="279" y="79" text-anchor="middle" font-size="9" font-weight="bold" fill="#2a4365">Automation</text>
  <rect x="324" y="60" rx="3" ry="3" width="74" height="28" fill="#e9d8fd" stroke="#805ad5" stroke-width="1.5"/>
  <text x="361" y="79" text-anchor="middle" font-size="9" font-weight="bold" fill="#44337a">Translation</text>

  <!-- Arrow down -->
  <line x1="240" y1="98" x2="240" y2="122" stroke="#5a6a7a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2: Right-Sized Work Items -->
  <rect x="90" y="126" rx="10" ry="10" width="300" height="50" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="240" y="149" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a5f">Right-Sized Work Items</text>
  <text x="240" y="167" text-anchor="middle" font-size="10" fill="#1e3a5f">Daniel Vacanti · no estimation needed</text>

  <!-- Arrow down -->
  <line x1="240" y1="176" x2="240" y2="200" stroke="#5a6a7a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3: Stable Throughput -->
  <rect x="90" y="204" rx="10" ry="10" width="300" height="70" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="240" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">Stable Throughput</text>
  <!-- Mini bar chart: stable weekly throughput -->
  <rect x="130" y="250" width="28" height="16" fill="#38a169" rx="2"/>
  <rect x="166" y="246" width="28" height="20" fill="#38a169" rx="2"/>
  <rect x="202" y="248" width="28" height="18" fill="#38a169" rx="2"/>
  <rect x="238" y="244" width="28" height="22" fill="#38a169" rx="2"/>
  <rect x="274" y="249" width="28" height="17" fill="#38a169" rx="2"/>
  <rect x="310" y="247" width="28" height="19" fill="#38a169" rx="2"/>
  <line x1="125" y1="266" x2="343" y2="266" stroke="#065f46" stroke-width="1"/>

  <!-- Arrow down -->
  <line x1="240" y1="274" x2="240" y2="298" stroke="#5a6a7a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 4: Monte Carlo Simulation -->
  <rect x="90" y="302" rx="10" ry="10" width="300" height="50" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
  <text x="240" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#44337a">Monte Carlo Simulation</text>
  <text x="240" y="343" text-anchor="middle" font-size="10" fill="#44337a">Troy Magennis · 500+ simulated futures</text>

  <!-- Arrow down -->
  <line x1="240" y1="352" x2="240" y2="376" stroke="#5a6a7a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 5: Probabilistic Forecast with Histogram -->
  <rect x="40" y="380" rx="10" ry="10" width="400" height="290" fill="#f7fafc" stroke="#4a5568" stroke-width="2"/>
  <text x="240" y="404" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d3748">Probabilistic Forecast</text>

  <!-- Histogram bars (distribution shape) -->
  <!-- baseline at y=580 -->
  <rect x="90"  y="564" width="24" height="16" fill="#bbf7d0" rx="1"/>
  <rect x="120" y="544" width="24" height="36" fill="#86efac" rx="1"/>
  <rect x="150" y="514" width="24" height="66" fill="#4ade80" rx="1"/>
  <rect x="180" y="474" width="24" height="106" fill="#22c55e" rx="1"/>
  <rect x="210" y="450" width="24" height="130" fill="#16a34a" rx="1"/>
  <rect x="240" y="460" width="24" height="120" fill="#16a34a" rx="1"/>
  <rect x="270" y="484" width="24" height="96" fill="#eab308" rx="1"/>
  <rect x="300" y="514" width="24" height="66" fill="#f59e0b" rx="1"/>
  <rect x="330" y="544" width="24" height="36" fill="#f97316" rx="1"/>
  <rect x="360" y="564" width="24" height="16" fill="#fb923c" rx="1"/>

  <!-- Axis -->
  <line x1="80" y1="580" x2="394" y2="580" stroke="#4a5568" stroke-width="1.5"/>
  <text x="240" y="598" text-anchor="middle" font-size="10" fill="#4a5568">completion date →</text>

  <!-- 50% confidence line -->
  <line x1="222" y1="418" x2="222" y2="580" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="198" y="414" rx="8" ry="8" width="48" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="222" y="428" text-anchor="middle" font-size="11" font-weight="bold" fill="#16a34a">50%</text>

  <!-- 85% confidence line -->
  <line x1="306" y1="418" x2="306" y2="580" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="282" y="414" rx="8" ry="8" width="48" height="20" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
  <text x="306" y="428" text-anchor="middle" font-size="11" font-weight="bold" fill="#ca8a04">85%</text>

  <!-- 95% confidence line -->
  <line x1="354" y1="418" x2="354" y2="580" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="330" y="414" rx="8" ry="8" width="48" height="20" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <text x="354" y="428" text-anchor="middle" font-size="11" font-weight="bold" fill="#ea580c">95%</text>

  <!-- Questions -->
  <text x="240" y="626" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a5f">"When will we be done?" → 85% by Mar 15</text>
  <text x="240" y="648" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a5f">"Start by Feb 1 to finish by Apr 1" → 85%</text>
  <text x="240" y="664" text-anchor="middle" font-size="10" fill="#5a6a7a" font-style="italic">no story points — just count slices</text>
</svg>
