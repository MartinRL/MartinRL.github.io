<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5a6a7a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="270" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2d3748">BFMSDD Loop</text>

  <!-- Step 1: Model Business Flows -->
  <rect x="130" y="52" rx="10" ry="10" width="280" height="48" fill="#fef3c7" stroke="#d69e2e" stroke-width="2"/>
  <text x="270" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#744210">1. Model Business Flows</text>
  <text x="270" y="90" text-anchor="middle" font-size="11" fill="#744210">facts · decisions · rules · actions · screens · actors</text>

  <!-- Arrow 1→2 -->
  <line x1="270" y1="100" x2="270" y2="118" stroke="#5a6a7a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2: Derive Specifications -->
  <rect x="130" y="122" rx="10" ry="10" width="280" height="48" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="270" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a5f">2. Derive Specifications</text>
  <text x="270" y="160" text-anchor="middle" font-size="11" fill="#1e3a5f">OpenAPI · AsyncAPI · GraphQL · JSON Schema</text>

  <!-- Arrow 2→3 -->
  <line x1="270" y1="170" x2="270" y2="188" stroke="#5a6a7a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3: Validate -->
  <rect x="170" y="192" rx="10" ry="10" width="200" height="40" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="270" y="217" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">3. Validate</text>

  <!-- Arrow 3→4 -->
  <line x1="270" y1="232" x2="270" y2="250" stroke="#5a6a7a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 4: Automate Boilerplate -->
  <rect x="130" y="254" rx="10" ry="10" width="280" height="48" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="270" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">4. Automate Boilerplate</text>
  <text x="270" y="292" text-anchor="middle" font-size="11" fill="#065f46">generate code · focus on business logic</text>

  <!-- Arrow 4→5 -->
  <line x1="270" y1="302" x2="270" y2="320" stroke="#5a6a7a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 5: Minimize Coupling -->
  <rect x="130" y="324" rx="10" ry="10" width="280" height="48" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="270" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#831843">5. Minimize Accidental Coupling</text>
  <text x="270" y="362" text-anchor="middle" font-size="11" fill="#831843">vertical slices · DRA · explicit decoupling</text>

  <!-- Arrow 5→6 -->
  <line x1="270" y1="372" x2="270" y2="390" stroke="#5a6a7a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 6: Implement -->
  <rect x="130" y="394" rx="10" ry="10" width="280" height="48" fill="#d4edda" stroke="#38a169" stroke-width="2"/>
  <text x="270" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#276749">6. Implement Business Logic</text>
  <text x="270" y="432" text-anchor="middle" font-size="11" fill="#276749">functional core · imperative shell</text>

  <!-- Arrow 6→7 -->
  <line x1="270" y1="442" x2="270" y2="460" stroke="#5a6a7a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 7: Release -->
  <rect x="190" y="464" rx="20" ry="20" width="160" height="40" fill="#4a5568" stroke="#2d3748" stroke-width="2"/>
  <text x="270" y="489" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Release</text>

  <!-- Loop-back arrow: Release → Model -->
  <path d="M190,484 L60,484 Q40,484 40,464 L40,76 Q40,56 60,56 L126,56"
        fill="none" stroke="#5a6a7a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="32" y="290" text-anchor="middle" font-size="12" fill="#5a6a7a" font-style="italic" transform="rotate(-90 32 290)">repeat</text>
</svg>
