                    "Det er som at stå i 2007 og se første iPhone"

                overgang: "Hvis I vil lære mere..."

            {
                number: "Slide 26",
                title: "Recommended Reading",
                timing: "",

                talepunkter: [

            {

                timing: "",

                talepunkter: [

                ],
                overgang: "Okay, det var det! Tid til spørgsmål..."

            {
                number: "Slide 28",
                title: "Q&A",
                timing: "~50 min total",
                kapitel: "Kapitel 4: Praksis",
                kernebudskab: "Åben til spørgsmål",
                talepunkter: [
                    "Fra 'magi til matematik'",
                    "Vi har dækket: Tokens, Transformers, Neural Networks, Training, Hallucinations, Context, Temperature, Agents",
                    "Hvad vil I vide mere om?",
                    "Spørgsmål? Pushback?"

                overgang: ""

        let currentSlide = 0;
        let startX = 0;
        let isDragging = false;

        function renderSlides() {
            const container = document.getElementById('container');
            slides.forEach((slide, index) => {
                const slideEl = document.createElement('div');
                slideEl.className = 'slide';
                slideEl.id = `slide-${index}`;

                let html = `
                    <div class="header">
                        <div class="slide-number">${slide.number}</div>
                        <div class="slide-title">${slide.title}</div>
                        ${slide.timing ? `<div class="timing">⏱️ ${slide.timing}</div>` : ''}
                        <div class="kapitel-badge">${slide.kapitel}</div>
                    </div>
                    <div class="content">
                        <div class="kernebudskab">
                            💡 <strong>Kernebudskab:</strong> ${slide.kernebudskab}
                        </div>
                `;

                if (slide.publikum) {
                    html += `
                        <div class="publikum">
                            <div class="publikum-title">🎤 Publikumsspørgsmål</div>
                            "${slide.publikum}"
                        </div>
                    `;
                }

                html += `
                    <div class="section">
                        <div class="section-title">Talepunkter</div>
                        <div class="section-content">
                `;

                slide.talepunkter.forEach(punkt => {
                    html += `<div class="bullet">${punkt}</div>`;
                });

                html += `
                        </div>
                    </div>
                `;

                if (slide.overgang) {
                    html += `
                        <div class="overgang">
                            <strong>↗ Overgang:</strong> "${slide.overgang}"
                        </div>
                    `;
                }

                html += `</div>`;
                slideEl.innerHTML = html;
                container.appendChild(slideEl);
            });
        }

        function showSlide(index) {
            // Hide all slides
            document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));

            // Show current slide
            const slide = document.getElementById(`slide-${index}`);
            if (slide) {
                slide.classList.add('active');
                slide.scrollTop = 0; // Reset scroll
            }

            // Update navigation
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === slides.length - 1;
            document.getElementById('progressText').textContent = `${index + 1} / ${slides.length}`;

            const progress = ((index + 1) / slides.length) * 100;
            document.getElementById('progressFill').style.width = `${progress}%`;

            // Hide swipe hint after first interaction
            if (index > 0) {
                document.getElementById('swipeHint').classList.add('hidden');
            }
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                showSlide(currentSlide);
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                showSlide(currentSlide);
            }
        }

        // Touch events for swiping
        document.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            if (!isDragging) return;

            const endX = e.changedTouches[0].clientX;
            const diff = startX - endX;

            // Swipe threshold: 50px
            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    nextSlide(); // Swipe left = next
                } else {
                    prevSlide(); // Swipe right = prev
                }
            }

            isDragging = false;
        }, { passive: true });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSlide();
            }
        });

        // Initialize
        renderSlides();
        showSlide(0);

        // Hide swipe hint after 3 seconds
        setTimeout(() => {
            document.getElementById('swipeHint').classList.add('hidden');
        }, 3000);
    </script>
